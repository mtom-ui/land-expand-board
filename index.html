/* ---- Fortschrittsbalken oben ---- */
// Formatiert "YYYY-MM-DD" als "DD.MM.YY"
function fmtDatum(iso){
  const m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}.${m[2]}.${m[1].slice(2)}` : "";
}
function renderProgress(){
  // --- Balken 1: Zeitverlauf von frühestem Phasenstart bis spätestem Phasenende ---
  const mitDatum = phases.filter(p => p.start && p.end);
  const startMs = mitDatum.length ? Math.min(...mitDatum.map(p => tsToMs(p.start))) : 0;
  const endMs   = mitDatum.length ? Math.max(...mitDatum.map(p => tsToMs(p.end)))   : 0;
  const spanne  = endMs - startMs;
  const heute   = Date.now();

  const phasesEl = $("#progTimePhases");
  const todayEl  = $("#progTimeToday");
  const labelsEl = $("#progTimeLabels");
  if(phasesEl && todayEl){
    if(spanne > 0){
      // Phasenabschnitte proportional zur Dauer, chronologisch sortiert
      const sortiert = [...mitDatum].sort((a,b)=> tsToMs(a.start) - tsToMs(b.start));
      // Welche Phase läuft gerade?
      const aktiveId = (sortiert.find(p => heute >= tsToMs(p.start) && heute <= tsToMs(p.end)) || {}).id;
      // Zwei dezente, abwechselnde Farbtöne aus der Akzentfarbe — ruhig statt bunt
      phasesEl.innerHTML = sortiert.map((p, idx) => {
        const left = (tsToMs(p.start) - startMs) / spanne * 100;
        const w = (tsToMs(p.end) - tsToMs(p.start)) / spanne * 100;
        const aktiv = p.id === aktiveId;
        const bg = aktiv
          ? "color-mix(in srgb, var(--accent) 32%, transparent)"
          : (idx % 2 === 0 ? "color-mix(in srgb, var(--accent) 15%, transparent)"
                           : "color-mix(in srgb, var(--accent) 8%, transparent)");
        return `<div class="prog-phase-seg" style="left:${left}%;width:${w}%;background:${bg};" title="${esc(p.name)}: ${fmtDatum(p.start)} – ${fmtDatum(p.end)}"></div>`;
      }).join("");

      // Namenslabels: mittig unter jedem Abschnitt positioniert
      if(labelsEl){
        labelsEl.innerHTML = sortiert.map(p => {
          const mitteMs = (tsToMs(p.start) + tsToMs(p.end)) / 2;
          const pos = Math.max(0, Math.min(100, (mitteMs - startMs) / spanne * 100));
          const aktiv = p.id === aktiveId;
          const wPct = (tsToMs(p.end) - tsToMs(p.start)) / spanne * 100;
          // maximale Labelbreite an Abschnittsbreite koppeln, damit nichts überlappt
          return `<span class="prog-phase-lbl${aktiv?" active":""}" style="left:${pos}%;max-width:${Math.max(wPct,10)}%;" title="${esc(p.name)}">${esc(p.name)}</span>`;
        }).join("");
      }

      // Heute-Marker positionieren (auf 0–100 % begrenzt)
      const pos = Math.max(0, Math.min(100, (heute - startMs) / spanne * 100));
      todayEl.style.left = pos + "%";
      todayEl.style.display = (heute < startMs || heute > endMs) ? "none" : "";
    } else {
      phasesEl.innerHTML = ""; todayEl.style.display = "none";
      if(labelsEl) labelsEl.innerHTML = "";
    }
  }
  const startLbl = $("#progTimeStart"), endLbl = $("#progTimeEnd"), timeVal = $("#progTimeVal");
  if(startLbl) startLbl.textContent = startMs ? fmtDatum(new Date(startMs).toISOString()) : "—";
  if(endLbl)   endLbl.textContent   = endMs   ? fmtDatum(new Date(endMs).toISOString())   : "—";
  if(timeVal){
    if(spanne > 0 && heute >= startMs && heute <= endMs){
      const verstrichen = Math.round((heute - startMs) / spanne * 100);
      const tageRest = Math.ceil((endMs - heute) / 86400000);
      timeVal.textContent = `${verstrichen}% · noch ${tageRest} Tag${tageRest!==1?"e":""}`;
    } else if(spanne > 0 && heute > endMs){
      timeVal.textContent = "abgeschlossen";
    } else if(spanne > 0){
      timeVal.textContent = "noch nicht gestartet";
    } else {
      timeVal.textContent = "keine Phasen-Daten";
    }
  }

  // --- Balken 2: Anteil erledigter Tickets (Done) an allen Tickets ---
  const gesamt = tickets.length;
  const erledigt = tickets.filter(t => t.status === "Done").length;
  const anteil = gesamt ? Math.round(erledigt / gesamt * 100) : 0;
  const fill = $("#progDoneFill"), doneVal = $("#progDoneVal"), doneSub = $("#progDoneSub");
  if(fill) fill.style.width = anteil + "%";
  if(doneVal) doneVal.textContent = gesamt ? `${anteil}%` : "—";
  if(doneSub) doneSub.textContent = gesamt ? `${erledigt} von ${gesamt} erledigt` : "Noch keine Tickets";
}

/* ---- Laden ---- */
async function loadFromSheet(){
  const raw = await sheetReadTabs([TAB_PHASES, TAB_OWNERS, TAB_TICKETS, TAB_SUBTASKS, TAB_UPDATES, TAB_TAGS]);
  for(const t of [TAB_PHASES, TAB_TICKETS]){
    if(!raw[t] || raw[t].error) throw new Error("Tab '" + t + "' fehlt oder ist leer: " + ((raw[t]&&raw[t].error) || "keine Daten"));
  }
  // Optionale Tabs (Owners, Subtasks, Updates, Tags): fehlend = leer behandeln
  const rows = t => (raw[t] && !raw[t].error && Array.isArray(raw[t])) ? raw[t] : [];

  // Phasen laden und gegen doppelte IDs absichern. Zwei Phasen mit derselben id
  // führen sonst dazu, dass ein Ticket (Zuordnung über phaseId===ph.id) in BEIDEN
  // Spalten auftaucht. Wir behalten die erste und sammeln die Konflikte für einen Hinweis.
  const phasenRoh = rows(TAB_PHASES).map(r => ({ id:String(r.id), name:r.name||"", start:String(r.start||""), end:String(r.end||""), desc:String(r.description||"").trim() }))
                                    .filter(p => p.id);
  const phasenSeen = new Map();     // id -> erster Name
  const phasenDup = [];             // {id, name} der ignorierten Duplikate
  phases = [];
  phasenRoh.forEach(p => {
    if(phasenSeen.has(p.id)){ phasenDup.push(p); return; }   // Duplikat: überspringen
    phasenSeen.set(p.id, p.name); phases.push(p);
  });
  phases.sort((a,b)=> (a.start||"").localeCompare(b.start||""));

  owners = rows(TAB_OWNERS).map(r => r.name).filter(Boolean);
  tags = rows(TAB_TAGS).map(r => ({ name:String(r.name||"").trim(), color:String(r.color||"").trim() })).filter(t => t.name);

  // Subtasks & Updates nach ticket_id gruppieren
  const bySub = {}, byUpd = {};
  rows(TAB_SUBTASKS).forEach(r => {
    if(!r.subtask_id || !r.ticket_id) return;
    (bySub[r.ticket_id] ||= []).push({ id:String(r.subtask_id), text:r.title||"", done:parseBool(r.done), pos:Number(r.pos)||0, owners:splitOwners(r.owners) });
  });
  Object.values(bySub).forEach(a => a.sort((x,y)=> x.pos - y.pos));
  rows(TAB_UPDATES).forEach(r => {
    if(!r.update_id || !r.ticket_id) return;
    (byUpd[r.ticket_id] ||= []).push({ id:String(r.update_id), author:r.author||"", ts:String(r.ts||""), text:r.text||"", edited:false });
  });
  Object.values(byUpd).forEach(a => a.sort((x,y)=> (x.ts||"").localeCompare(y.ts||"")));

  // Tickets laden und gegen doppelte IDs absichern (z.B. falls ein früherer
  // Sync-Fehler dieselbe Zeile zweimal angelegt hat). Erste ID gewinnt.
  const ticketSeen = new Set();
  const ticketDup = [];
  tickets = [];
  rows(TAB_TICKETS).filter(r => r.id).forEach(r => {
    const id = String(r.id);
    if(ticketSeen.has(id)){ ticketDup.push({ id, title:r.title||"" }); return; }
    ticketSeen.add(id);
    tickets.push({
      id, title:r.title||"", goal:r.goal||"", desc:r.description||"",
      start:String(r.start||"").trim(), end:String(r.end||"").trim(),
      prio: PRIO_MIGRATION[String(r.prio||"").trim()] || "",
      status: STATUS_MIGRATION[String(r.status||"").trim()] || DEFAULT_STATUS, owners:splitOwners(r.owners), tags:splitOwners(r.tags), stakeholder:String(r.stakeholder||"").trim(),
      blockedBy: String(r.blocked_by||"").split(",").map(s=>s.trim()).filter(Boolean),
      created:String(r.created||"").trim(), updated:String(r.updated||"").trim(),
      subtasks:bySub[id]||[], updates:byUpd[id]||[]
    });
  });

  // Hinweis auf Datenprobleme zusammenstellen (wird in der Sync-Anzeige gezeigt)
  const warnungen = [];
  if(phasenDup.length){
    warnungen.push("Doppelte Phasen-ID im Tab 'Phases': " +
      phasenDup.map(p => `"${p.name}" (id ${p.id})`).join(", ") +
      ". Jede Phase braucht eine eindeutige id — sonst erscheinen Tickets in mehreren Spalten.");
  }
  if(ticketDup.length){
    warnungen.push("Doppelte Ticket-ID im Tab 'Tickets': " +
      ticketDup.map(t => `"${t.title}" (id ${t.id})`).join(", ") +
      ". Die zusätzliche Zeile wird ignoriert; bitte im Sheet entfernen.");
  }
  dataWarnung = warnungen.length ? warnungen.join("\n\n") : null;

  saveCache();  // frischen Stand lokal sichern
  lastFetch = Date.now();
  renderLastUpd();
  renderDataWarnung();
}

/* ---- Speichern: Ticket-Diff (Kernzeile + Subtasks + Updates) ---- */
// Vergleicht das bearbeitete Ticket mit dem alten Stand und erzeugt minimale Sheet-Ops.
function diffTicketOps(neu, alt){
  const ops = [];
  const isNew = !alt;
  // Kernzeile
  const kern = ticketToRow(neu);
  ops.push(isNew ? opAppend(TAB_TICKETS, kern) : opUpdate(TAB_TICKETS, "id", neu.id, kern));

  // Subtasks
  const altSub = new Map((alt?.subtasks||[]).map(s => [s.id, s]));
  (neu.subtasks||[]).forEach((s, i) => {
    s.pos = (i + 1) * 10;
    const row = subToRow(s, neu.id);
    const a = altSub.get(s.id);
    if(!a) ops.push(opAppend(TAB_SUBTASKS, row));
    else if(a.text!==s.text || a.done!==s.done || a.pos!==s.pos || joinOwners(a.owners)!==joinOwners(s.owners)) ops.push(opUpdate(TAB_SUBTASKS, "subtask_id", s.id, row));
    altSub.delete(s.id);
  });
  altSub.forEach((_, id) => ops.push(opDelete(TAB_SUBTASKS, "subtask_id", id)));  // gelöschte

  // Updates: hinzufügen, ändern (Text) und löschen
  const altUpd = new Map((alt?.updates||[]).map(u => [u.id, u]));
  (neu.updates||[]).forEach(u => {
    const a = altUpd.get(u.id);
    if(!a) ops.push(opAppend(TAB_UPDATES, updToRow(u, neu.id)));
    else if((a.text||"") !== (u.text||"")) ops.push(opUpdate(TAB_UPDATES, "update_id", u.id, updToRow(u, neu.id)));
    altUpd.delete(u.id);
  });
  altUpd.forEach((_, id) => ops.push(opDelete(TAB_UPDATES, "update_id", id)));  // gelöschte

  return ops;
}

// Merkt sich den geladenen Stand je Ticket, um beim Speichern zu diffen.
function snapshot(id){ const t = tickets.find(x=>x.id===id); return t ? JSON.parse(JSON.stringify(t)) : null; }

// Zeitstempel im selben Format wie Updates: "YYYY-MM-DD HH:MM"
function jetztTs(){
  // Lokale Zeit als "YYYY-MM-DD HH:MM" (nicht UTC, sonst Zeitzonen-Versatz beim Zurückrechnen)
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function saveTicket(neu, altSnapshot){
  const isNew = !neu.id;
  if(isNew) neu.id = uid("T");
  // Zeitstempel pflegen: created einmalig beim Anlegen, updated bei jeder Änderung
  const ts = jetztTs();
  if(isNew && !neu.created) neu.created = ts;
  neu.updated = ts;
  // lokalen State aktualisieren (optimistisch)
  const i = tickets.findIndex(x => x.id === neu.id);
  if(i >= 0) tickets[i] = neu; else tickets.push(neu);
  if(backendConfigured()) enqueue((isNew?"Ticket anlegen: ":"Ticket speichern: ") + (neu.title||""), diffTicketOps(neu, altSnapshot));
  return neu;
}
function deleteTicket(id){
  const t = tickets.find(x => x.id === id);
  tickets = tickets.filter(x => x.id !== id);
  if(backendConfigured()) enqueue("Ticket löschen: " + ((t&&t.title)||""), [
    opDelete(TAB_TICKETS, "id", id),
    opDelete(TAB_SUBTASKS, "ticket_id", id),
    opDelete(TAB_UPDATES, "ticket_id", id),
  ]);
}
function changeStatus(id, status){
  const t = tickets.find(x => x.id === id); if(!t) return;
  t.status = status;
  t.updated = jetztTs();
  if(backendConfigured()) enqueue("Status: " + (t.title||""), [ opUpdate(TAB_TICKETS, "id", id, ticketToRow(t)) ]);
}

const MS_TAG = 86400000;
function parseDate(s){ // "YYYY-MM-DD" -> Date (lokale Mitternacht) oder null
  if(!s) return null;
  const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function tageZwischen(a, b){ return Math.round((b - a) / MS_TAG); }
function addTage(d, n){ return new Date(d.getTime() + n*MS_TAG); }
function startOfWeek(d){ const x = new Date(d); const wd = (x.getDay()+6)%7; return addTage(x, -wd); } // Montag
function hatDatum(t){ return !!(parseDate(t.start) && parseDate(t.end)); }

// Baut die Aufgaben-Datenstruktur: pro Owner alle offenen Tickets + offenen Subtasks.
// "Offen" = Ticket-Status Open oder Blocked (nicht Done); Subtask nicht erledigt.
function sammleAufgaben(){
  const proOwner = new Map();   // owner -> { tickets:[], subtasks:[] }
  const ensure = o => { if(!proOwner.has(o)) proOwner.set(o, { tickets:[], subtasks:[] }); return proOwner.get(o); };

  tickets.forEach(t => {
    // Nur relevante Aufgaben: aktiv in Arbeit oder als Nächstes geplant
    if(t.status !== "Ongoing") return;   // nur laufende Aufgaben
    if(!passesFilter(t)) return;                  // aktive Board-Filter/Suche respektieren
    // Ticket selbst als Aufgabe je Owner
    (t.owners.length ? t.owners : ["(ohne Owner)"]).forEach(o => ensure(o).tickets.push(t));
    // offene Subtasks je Subtask-Owner (fällt zurück auf Ticket-Owner, wenn keiner gesetzt)
    t.subtasks.forEach(s => {
      if(s.done) return;
      const subOwners = (s.owners && s.owners.length) ? s.owners : (t.owners.length ? t.owners : ["(ohne Owner)"]);
      subOwners.forEach(o => ensure(o).subtasks.push({ sub:s, ticket:t }));
    });
  });
  return proOwner;
}

    grp.className = "task-group";
    grp.innerHTML = `<div class="task-group-head"><span class="tg-name">${esc(o)}</span>
      <span class="tg-count">${d.tickets.length + d.subtasks.length} offen</span></div>`;

    const list = document.createElement("div");
    list.className = "task-list";

    // Tickets zuerst, dann Subtasks
    d.tickets.forEach(t => list.appendChild(taskRowTicket(t)));
    d.subtasks.forEach(({sub, ticket}) => list.appendChild(taskRowSubtask(sub, ticket)));

    grp.appendChild(list);
    root.appendChild(grp);
  });
}

// Blocker-Helfer (blockedBy ist ein Array von Ticket-IDs)
function blockerListe(t){
  const ids = Array.isArray(t.blockedBy) ? t.blockedBy : (t.blockedBy ? [t.blockedBy] : []);
  return ids.map(id => tickets.find(x => x.id === id)).filter(Boolean);
}
function offeneBlocker(t){ return blockerListe(t).filter(b => b.status !== "Done"); }
function istBlockiert(t){ return offeneBlocker(t).length > 0; }

// Zeile für ein ganzes Ticket
function taskRowTicket(t){
  const blockiert = istBlockiert(t);
  const row = document.createElement("div");
  row.className = "task-row ticket" + (blockiert ? " blocked" : "");
  const subOpen = t.subtasks.filter(s=>!s.done).length;
  const meta = [];
  meta.push(phaseName(t.phaseId));
  meta.push(STATUS_LABEL[t.status] || t.status);
  if(subOpen) meta.push(`${subOpen} offene Subtask${subOpen>1?"s":""}`);
  if(blockiert) meta.push(`blockiert (${offeneBlocker(t).length})`);
  const badge = frischeBadge(t);
  row.innerHTML = `
    <span class="task-dot ${blockiert?"blk":"open"}"></span>
    <div class="task-main">
      <div class="task-title">${esc(t.title)}${badge}</div>
      <div class="task-sub">${meta.filter(Boolean).map(esc).join(" · ")}</div>
    </div>
    <span class="task-kind">Ticket</span>`;
  row.onclick = () => openTicket(t.id);
  return row;
}

// Zeile für einen einzelnen offenen Subtask
function taskRowSubtask(s, t){
  const row = document.createElement("div");
  row.className = "task-row subtask";
  row.innerHTML = `
    <span class="task-check" title="Als erledigt markieren">○</span>
    <div class="task-main">
      <div class="task-title">${esc(s.text)}</div>
      <div class="task-sub">${esc(phaseName(t.phaseId))} · aus „${esc(t.title)}"</div>
    </div>
    <span class="task-kind sub">Subtask</span>`;
  // Klick auf den Kreis: Subtask direkt abhaken (ohne Dialog)
  row.querySelector(".task-check").addEventListener("click", e => {
    e.stopPropagation();
    toggleSubtaskDone(t.id, s.id);
  });
  // Klick auf die Zeile: zugehöriges Ticket öffnen
  row.onclick = () => openTicket(t.id);
  return row;
}

// Subtask abhaken und speichern (aus der Aufgabenliste heraus)
function toggleSubtaskDone(ticketId, subId){
  const t = tickets.find(x=>x.id===ticketId); if(!t) return;
  const s = t.subtasks.find(x=>x.id===subId); if(!s) return;
  const snap = snapshot(ticketId);
  s.done = !s.done;
  t.updated = jetztTs();
  if(backendConfigured()) enqueue("Subtask erledigt: " + (s.text||""), diffTicketOps(t, snap));
  renderTasks();
}

/* ===================== GANTT ===================== */
let ganttState = { start:null, end:null, pxProTag:0, drag:null };

function renderGesamtfortschritt(liste){
  const el = $("#ganttProgress"); if(!el) return;
  const gesamt = liste.length;
  if(!gesamt){ el.style.display = "none"; return; }
  el.style.display = "flex";
  const done = liste.filter(t => t.status === "Done").length;
  const heute = new Date(); heute.setHours(0,0,0,0);
  const ueberfaellig = liste.filter(t => t.status !== "Done" && parseDate(t.end) && parseDate(t.end) < heute).length;
  const pct = Math.round(done / gesamt * 100);
  el.innerHTML = `
    <span class="gp-text"><b>${pct}%</b> erledigt</span>
    <div class="gp-bar-wrap"><div class="gp-bar-fill" style="width:${pct}%"></div></div>
    <span class="gp-stats">
      <span>${done}/${gesamt} Tickets</span>
      ${ueberfaellig?`<span class="st-over">⚠ ${ueberfaellig} überfällig</span>`:""}
    </span>`;
}

function renderGantt(){
  const inner = $("#ganttInner");
  const noDateWrap = $("#ganttNoDate");
  if(!inner) return;

  // Treffer = erfüllt ALLE aktiven Filter (harte Filter + Suche)
  const treffer = tickets.filter(t => passesHardFilter(t) && passesSearch(t));
  // Ist überhaupt ein Filter aktiv? Dann Blocker-Ketten der Treffer ausgegraut mitziehen.
  const filterAktiv = !!(searchQuery || ownerFilter.size || statusFilter.size || prioFilter.size || tagFilter.size);
  const sichtbarIds = new Set(treffer.map(t => t.id));
  const dimmedIds = new Set();
  if(filterAktiv){
    treffer.forEach(t => {
      alleBlockerIds(t).forEach(bid => {
        if(!sichtbarIds.has(bid)){ sichtbarIds.add(bid); dimmedIds.add(bid); }
      });
    });
  }
  const sichtbar = tickets.filter(t => sichtbarIds.has(t.id));
  const mitDatum = sichtbar.filter(hatDatum);
  const ohneDatum = sichtbar.filter(t => !hatDatum(t));

  // Gesamtfortschritt: nur echte Treffer zählen (mitgezogene Blocker verwässern nicht)
  renderGesamtfortschritt(filterAktiv ? treffer : sichtbar);

  // "Ohne Datum"-Liste oben
  if(ohneDatum.length){
    noDateWrap.style.display = "";
    noDateWrap.innerHTML = `<div class="nd-head">Ohne Datum (${ohneDatum.length}) — zum Einplanen anklicken</div>`;
    const wrap = document.createElement("div"); wrap.className = "nd-list";
    ohneDatum.forEach(t => {
      const chip = document.createElement("button");
      chip.className = "nd-chip";
      chip.innerHTML = `${t.prio?`<span class="nd-prio" style="background:${PRIO_COLOR[t.prio]||'var(--muted-hell)'}"></span>`:""}${esc(t.title||t.id)}`;
      chip.onclick = () => openTicket(t.id);
      wrap.appendChild(chip);
    });
    noDateWrap.appendChild(wrap);
  } else {
    noDateWrap.style.display = "none";
    noDateWrap.innerHTML = "";
  }

  if(!mitDatum.length){
    inner.innerHTML = `<div style="color:var(--muted);font-size:14px;padding:20px 4px;">Keine terminierten Tickets. Trage bei einem Ticket Start- und Enddatum ein${ohneDatum.length?" — z.B. aus der Liste oben":""}.</div>`;
    return;
  }

  // Zeitfenster bestimmen (mit etwas Rand)
  let minD = null, maxD = null;
  mitDatum.forEach(t => {
    const s = parseDate(t.start), e = parseDate(t.end);
    if(!minD || s < minD) minD = s;
    if(!maxD || e > maxD) maxD = e;
  });
  const heute = new Date(); heute.setHours(0,0,0,0);
  if(heute < minD) minD = heute;
  if(heute > maxD) maxD = heute;

  const woche = ganttUnit === "week";
  // Raster auf Wochenanfang/Tagesanfang ausrichten, Rand ergänzen
  let start = woche ? startOfWeek(minD) : addTage(minD, -2);
  let end   = woche ? addTage(startOfWeek(maxD), 13) : addTage(maxD, 3);
  const tage = tageZwischen(start, end) + 1;
  const pxProTag = woche ? 26 : 34;
  const rowH = 40, labelW = 210;

  ganttState = { start, end, pxProTag, labelW, rowH };

  // Sortierung: nach Startdatum, dann Prio
  const sortTickets = arr => arr.slice().sort((a,b) => {
    const sa = parseDate(a.start)-parseDate(b.start);
    if(sa) return sa;
    return (PRIO_RANG[a.prio||""] - PRIO_RANG[b.prio||""]);
  });

  // Zeilen-Liste bauen: entweder flach oder nach Owner gruppiert
  const zeilen = [];  // {typ:"ticket", t} | {typ:"gruppe", name}
  if(ganttGroup === "owner"){
    // Jedes Ticket erscheint unter jedem seiner Owner (oder "Ohne Owner")
    const proOwner = {};
    mitDatum.forEach(t => {
      const os = (t.owners && t.owners.length) ? t.owners : ["Ohne Owner"];
      os.forEach(o => { (proOwner[o] = proOwner[o] || []).push(t); });
    });
    Object.keys(proOwner).sort((a,b) => a==="Ohne Owner"?1:b==="Ohne Owner"?-1:a.localeCompare(b)).forEach(o => {
      const grp = proOwner[o];
      const done = grp.filter(t => t.status === "Done").length;
      zeilen.push({ typ:"gruppe", name:o, anzahl:grp.length, done });
      sortTickets(grp).forEach(t => zeilen.push({ typ:"ticket", t }));
    });
  } else if(ganttGroup === "tag"){
    // Nach Tag gruppieren (ein Ticket hat höchstens einen Tag)
    const proTag = {};
    mitDatum.forEach(t => {
      const tg = (t.tags && t.tags.length) ? t.tags[0] : "Ohne Tag";
      (proTag[tg] = proTag[tg] || []).push(t);
    });
    // Reihenfolge wie im Tags-Tab (von oben nach unten), unbekannte Tags danach, "Ohne Tag" zuletzt
    const reihenfolge = tags.map(t => t.name);
    const vorhanden = Object.keys(proTag);
    const sortiert = vorhanden.slice().sort((a,b) => {
      if(a==="Ohne Tag") return 1;
      if(b==="Ohne Tag") return -1;
      const ia = reihenfolge.indexOf(a), ib = reihenfolge.indexOf(b);
      return (ia<0?999:ia) - (ib<0?999:ib);
    });
    sortiert.forEach(tg => {
      const grp = proTag[tg];
      const done = grp.filter(t => t.status === "Done").length;
      const farbe = (tagByName(tg)||{}).color || "";
      zeilen.push({ typ:"gruppe", name:tg, anzahl:grp.length, done, color:farbe });
      sortTickets(grp).forEach(t => zeilen.push({ typ:"ticket", t }));
    });
  } else {
    sortTickets(mitDatum).forEach(t => zeilen.push({ typ:"ticket", t }));
  }

  const breite = labelW + tage * pxProTag;
  const hoehe = 40 + zeilen.length * rowH + 10;

  // Kopf-Zeitachse (Ticks = sticky-Kopf, Grid = volle Höhe im Hintergrund)
  const heuteX = labelW + tageZwischen(start, heute) * pxProTag;
  let achse = "", grid = "";
  if(woche){
    for(let d = new Date(start); d <= end; d = addTage(d, 7)){
      const x = labelW + tageZwischen(start, d) * pxProTag;
      const kw = kalenderwoche(d);
      achse += `<div class="g-tick" style="left:${x}px">KW ${kw}<span class="g-tick-sub">${d.getDate()}.${d.getMonth()+1}</span></div>`;
      grid  += `<div class="g-grid" style="left:${x}px;height:${hoehe}px"></div>`;
    }
  } else {
    for(let d = new Date(start); d <= end; d = addTage(d, 1)){
      const x = labelW + tageZwischen(start, d) * pxProTag;
      const we = (d.getDay()===0 || d.getDay()===6);
      const monatsanfang = d.getDate()===1;
      achse += `<div class="g-tick ${we?'we':''}" style="left:${x}px">${WOCHENTAG[(d.getDay()+6)%7]}<span class="g-tick-sub">${d.getDate()}.${monatsanfang?` ${MONATE[d.getMonth()]}`:""}</span></div>`;
      grid  += `<div class="g-grid ${we?'we':''}" style="left:${x}px;height:${hoehe}px"></div>`;
    }
  }

  // Balken
  let balken = "";
  const pos = {};  // id -> {x, y, w, mid} für Verbindungslinien (erste Position bei Mehrfach)
  zeilen.forEach((z, i) => {
    const y = 40 + i * rowH;
    if(z.typ === "gruppe"){
      balken += `
        <div class="g-row g-grouprow" style="top:${y}px;height:${rowH}px">
          <div class="g-grouplabel" style="width:${labelW}px">${z.color?`<span class="gl-dot" style="background:${z.color}"></span>`:""}<span class="gl-name">${esc(z.name)}</span> <span class="gl-count">${z.anzahl}</span>${z.anzahl?`<span class="gl-prog" title="${z.done||0}/${z.anzahl} erledigt"><span class="gl-prog-fill" style="width:${Math.round((z.done||0)/z.anzahl*100)}%"></span></span>`:""}</div>
        </div>`;
      return;
    }
    const t = z.t;
    const s = parseDate(t.start), e = parseDate(t.end);
    const x = labelW + tageZwischen(start, s) * pxProTag;
    const w = Math.max(pxProTag*0.8, (tageZwischen(s, e)+1) * pxProTag);
    const farbe = PRIO_COLOR[t.prio] || "var(--muted-hell)";
    const blk = istBlockiert(t);
    const done = t.status === "Done";
    const dauer = tageZwischen(s, e) + 1;
    const meilenstein = dauer === 1;
    const schmal = !meilenstein && w < 130;

    let prog = 0;
    if(done) prog = 100;
    else {
      const gesamt = (e - s) + MS_TAG;
      const verstrichen = heute - s + MS_TAG;
      prog = Math.max(0, Math.min(100, Math.round(verstrichen / gesamt * 100)));
    }
    const ueberfaellig = !done && e < heute;

    const tip = `${t.title} · ${t.start}${meilenstein?"":` – ${t.end}`} (${meilenstein?"Meilenstein":`${dauer} Tage`})${t.prio?` · ${t.prio}`:""} · ${STATUS_LABEL[t.status]||t.status}${!done?` · ${prog}%`:""}`;
    if(!pos[t.id]) pos[t.id] = { x, y: y+7+13, w: meilenstein?26:w, barTop:y+7, barBot:y+7+26, mid:y+7+13, rowIndex:i };
    const dim = dimmedIds.has(t.id) ? " dimmed" : "";

    const rowLabel = `
      <div class="g-row${dim}" style="top:${y}px;height:${rowH}px" data-goal-id="${esc(t.id)}">
        <div class="g-rowlabel" style="width:${labelW}px" data-id="${esc(t.id)}" title="${esc(t.title)}">
          <span class="g-prio" style="background:${farbe}" title="${esc(t.prio||'ohne Priorität')}"></span>
          <span class="g-rowtitle">${esc(t.title||t.id)}</span>
        </div>
      </div>`;

    if(meilenstein){
      balken += rowLabel + `
        <div class="g-milestone ${done?'done':''} ${ueberfaellig?'overdue':''}${dim}" data-id="${esc(t.id)}"
             style="left:${x}px; top:${y+7}px" title="${esc(tip)}">
          <span class="ms-diamond" style="background:${farbe}"></span>
          <span class="ms-label">${esc(t.title||t.id)}</span>
        </div>`;
    } else {
      balken += rowLabel + `
        <div class="g-bar ${done?'done':''} ${blk?'blocked':''} ${schmal?'schmal':''} ${ueberfaellig?'overdue':''}${dim}" data-id="${esc(t.id)}"
             style="left:${x}px; top:${y+7}px; width:${w}px" title="${esc(tip)}">
          <span class="g-handle l"></span>
          <span class="g-bar-prio" style="background:${farbe}"></span>
          ${schmal ? "" : `<span class="g-bar-label">${esc(t.title||t.id)}</span><span class="g-bar-owners">${(t.owners||[]).map(initialen).join(" ")}</span>`}
          <span class="g-handle r"></span>
          ${schmal ? `<span class="g-bar-outside">${esc(t.title||t.id)}</span>` : ""}
        </div>`;
    }
  });

  // Verbindungslinien: Blocker A -> blockiertes Ticket B ("A muss vor B fertig sein").
  // Führung raus aus A (rechts, Mitte) -> vertikale Bahn -> Einlauf in B (links, Mitte).
  // Die vertikale Bahn liegt rechts von A und links von B, damit sie keinen Balken quert.
  let linien = "";
  const RAD = 6;
  if(ganttLinks) mitDatum.forEach(t => {
    blockerListe(t).forEach(b => {
      if(!pos[b.id] || !pos[t.id]) return;
      const A = pos[b.id], B = pos[t.id];
      const offen = b.status !== "Done";
      const c = offen ? "var(--overdue)" : "var(--gr-done)";
      const dash = offen ? "" : 'stroke-dasharray="5 4"';
      const mark = `url(#gm-${offen?'o':'d'})`;

      const x1 = A.x + A.w, y1 = A.mid;   // rechte Kante Blocker
      const x2 = B.x,       y2 = B.mid;   // linke Kante Ziel
      const dir = y2 >= y1 ? 1 : -1;

      // Vertikale Bahn möglichst in die Lücke zwischen A-Ende und B-Anfang legen.
      // Ist da kein Platz (Ziel liegt links/überlappt), Bahn knapp rechts von A —
      // dann läuft der Einlauf von rechts in B (Marker zeigt trotzdem nach links).
      let d;
      if(x2 - 14 > x1 + 14){
        const bx = Math.round((x1 + x2) / 2);
        const r = Math.min(RAD, Math.abs(y2 - y1)/2 || RAD);
        d = `M ${x1} ${y1} L ${bx - r} ${y1} Q ${bx} ${y1} ${bx} ${y1 + dir*r}`
          + ` L ${bx} ${y2 - dir*r} Q ${bx} ${y2} ${bx + r} ${y2} L ${x2 - 7} ${y2}`;
      } else {
        // Umweg: rechts aus A raus, hoch/runter, dann von links in B
        const bx = x1 + 18;                 // Bahn rechts von A
        const ex = Math.max(B.x - 18, 4);   // Einlaufpunkt links von B
        const r = Math.min(RAD, Math.abs(y2 - y1)/2 || RAD);
        d = `M ${x1} ${y1} L ${bx - r} ${y1} Q ${bx} ${y1} ${bx} ${y1 + dir*r}`
          + ` L ${bx} ${y2 - dir*r} Q ${bx} ${y2} ${bx - r} ${y2} L ${x2 - 7} ${y2}`;
      }
      linien += `<path class="g-link" data-from="${esc(b.id)}" data-to="${esc(t.id)}" d="${d}" fill="none" stroke="${c}" stroke-width="1.6" ${dash} marker-end="${mark}" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
  });

  inner.style.width = breite + "px";
  inner.style.height = hoehe + "px";
  inner.innerHTML = `
    <div class="g-gridlayer">${grid}</div>
    <div class="g-today" style="left:${heuteX}px;height:${hoehe}px" title="Heute"></div>
    <svg class="g-links" width="${breite}" height="${hoehe}" style="position:absolute;top:0;left:0;pointer-events:none;z-index:4;overflow:visible">
      <defs>
        <marker id="gm-o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--overdue)"/></marker>
        <marker id="gm-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="var(--gr-done)"/></marker>
      </defs>
      ${linien}
    </svg>
    <div class="g-axis">${achse}</div>
    <div class="g-corner" style="width:${labelW}px"></div>
    ${balken}`;

  bindGanttInteraction();
  bindGoalPopover();

  // Beim ersten Öffnen automatisch zu "heute" scrollen
  if(!renderGantt._zentriert){
    renderGantt._zentriert = true;
    requestAnimationFrame(() => {
      const sc = $("#ganttScroll");
      if(sc && ganttState.start){
        const hx = ganttState.labelW + tageZwischen(ganttState.start, heute) * ganttState.pxProTag;
        sc.scrollLeft = Math.max(0, hx - sc.clientWidth/2);
      }
    });
  }
}

// Hover über eine Gantt-Zeile zeigt das Ziel als Popover
function bindGoalPopover(){
  const scroll = $("#ganttScroll");
  const svg = () => $("#ganttInner").querySelector(".g-links");
  let pop = null;
  function highlightAus(){
    const s = svg(); if(!s) return;
    s.classList.remove("hover-active");
    s.querySelectorAll(".g-link.hot").forEach(l => l.classList.remove("hot"));
  }
  function highlightAn(id){
    const s = svg(); if(!s) return;
    s.classList.add("hover-active");
    s.querySelectorAll(".g-link").forEach(l => {
      if(l.dataset.from === id || l.dataset.to === id) l.classList.add("hot");
    });
  }
  function entferne(){ if(pop){ pop.remove(); pop = null; } highlightAus(); }
  function zeige(t, ankerLeft, ankerTop){
    if(ganttState.drag) return;
    entferne();
    highlightAn(t.id);
    const dauer = (parseDate(t.start)&&parseDate(t.end)) ? tageZwischen(parseDate(t.start),parseDate(t.end))+1 : null;
    const metaTeile = [];
    if(t.start && t.end) metaTeile.push(`${t.start} – ${t.end}${dauer?` · ${dauer} Tag${dauer>1?"e":""}`:""}`);
    if(t.prio) metaTeile.push(t.prio);
    if(t.owners && t.owners.length) metaTeile.push(t.owners.join(", "));
    if(t.status) metaTeile.push(STATUS_LABEL[t.status]||t.status);
    // Abhängigkeiten: wartet auf (Blocker) + blockiert (Nachfolger)
    const wartetAuf = blockerListe(t);
    const blockiert = tickets.filter(x => blockerListe(x).some(b => b.id === t.id));
    const depHtml = (wartetAuf.length || blockiert.length) ? `
      <div class="gp-deps">
        ${wartetAuf.length ? `<div class="gp-dep"><span class="gp-dep-lbl wait">⛔ Wartet auf</span>${wartetAuf.map(b=>`<span class="gp-dep-item${b.status==='Done'?' done':''}">${esc(b.title||b.id)}</span>`).join("")}</div>` : ""}
        ${blockiert.length ? `<div class="gp-dep"><span class="gp-dep-lbl block">→ Blockiert</span>${blockiert.map(b=>`<span class="gp-dep-item">${esc(b.title||b.id)}</span>`).join("")}</div>` : ""}
      </div>` : "";
    pop = document.createElement("div");
    pop.className = "g-goal-pop";
    pop.innerHTML = `
      <div class="gp-head">${esc(t.title||t.id)}</div>
      ${metaTeile.length?`<div class="gp-meta">${esc(metaTeile.join(" · "))}</div>`:""}
      ${depHtml}
      ${t.goal && t.goal.trim() ? `<div class="gp-title">📌 Ziel</div><div class="gp-goal">${mdToHtml(t.goal)}</div>` : ""}`;
    $("#ganttInner").appendChild(pop);
    const scRect = scroll.getBoundingClientRect();
    const maxLeft = scroll.scrollLeft + scRect.width - pop.offsetWidth - 12;
    let left = Math.max(ganttState.labelW + 4, ankerLeft);
    left = Math.min(left, Math.max(ganttState.labelW + 4, maxLeft));
    pop.style.left = left + "px";
    pop.style.top = (ankerTop + 30) + "px";
    requestAnimationFrame(() => pop && pop.classList.add("show"));
  }
  const inner = $("#ganttInner");
  inner.querySelectorAll(".g-bar, .g-milestone").forEach(bar => {
    const t = tickets.find(x => x.id === bar.dataset.id);
    if(!t) return;
    bar.addEventListener("mouseenter", () => zeige(t, parseFloat(bar.style.left)||0, parseFloat(bar.style.top)||0));
    bar.addEventListener("mouseleave", entferne);
    bar.addEventListener("mousedown", entferne);
  });
  inner.querySelectorAll(".g-rowlabel").forEach(lbl => {
    const t = tickets.find(x => x.id === lbl.dataset.id);
    if(!t) return;
    const row = lbl.closest(".g-row");
    const top = row ? (parseFloat(row.style.top)||0) : 0;
    lbl.addEventListener("mouseenter", () => zeige(t, ganttState.labelW + 4, top));
    lbl.addEventListener("mouseleave", entferne);
  });
  if(scroll && !scroll._popClean){ scroll._popClean = true; scroll.addEventListener("scroll", entferne); }
}

function kalenderwoche(d){
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (date.getDay()+6)%7;
  date.setDate(date.getDate() - day + 3);
  const firstThu = new Date(date.getFullYear(),0,4);
  const diff = (date - firstThu) / MS_TAG;
  return 1 + Math.round((diff - 3 + ((firstThu.getDay()+6)%7)) / 7);
}

// Balken öffnen (Klick) + ziehen (verschieben/Kanten)
function bindGanttInteraction(){
  const inner = $("#ganttInner");
  // Zeilen-Label + Balken-Klick öffnet Ticket
  inner.querySelectorAll(".g-rowlabel").forEach(el => {
    el.onclick = () => openTicket(el.dataset.id);
  });

  // Balken UND Meilensteine ziehbar
  inner.querySelectorAll(".g-bar, .g-milestone").forEach(el => {
    const istMs = el.classList.contains("g-milestone");
    el.addEventListener("mousedown", e => {
      let modus = "move";
      if(!istMs && e.target.classList.contains("g-handle")) modus = e.target.classList.contains("l") ? "l" : "r";
      const id = el.dataset.id;
      const t = tickets.find(x=>x.id===id);
      if(!t) return;
      ganttState.drag = {
        id, modus, istMs, startX: e.clientX,
        origStart: parseDate(t.start), origEnd: parseDate(t.end),
        bar: el, moved:false
      };
      e.preventDefault(); e.stopPropagation();
      document.body.style.userSelect = "none";
    });
    el.addEventListener("click", e => {
      if(ganttState.drag && ganttState.drag.moved) return;
      if(e.target.classList.contains("g-handle")) return;
      openTicket(el.dataset.id);
    });
  });

  if(!bindGanttInteraction._global){
    bindGanttInteraction._global = true;
    window.addEventListener("mousemove", e => {
      const d = ganttState.drag; if(!d) return;
      const dxTage = Math.round((e.clientX - d.startX) / ganttState.pxProTag);
      if(dxTage === 0 && !d.moved) return;
      d.moved = true;
      let ns = new Date(d.origStart), ne = new Date(d.origEnd);
      if(d.modus === "move"){ ns = addTage(d.origStart, dxTage); ne = addTage(d.origEnd, dxTage); }
      else if(d.modus === "l"){ ns = addTage(d.origStart, dxTage); if(ns > ne) ns = new Date(ne); }
      else if(d.modus === "r"){ ne = addTage(d.origEnd, dxTage); if(ne < ns) ne = new Date(ns); }
      const x = ganttState.labelW + tageZwischen(ganttState.start, ns) * ganttState.pxProTag;
      d.bar.style.left = x + "px";
      if(!d.istMs){
        const w = Math.max(ganttState.pxProTag*0.8, (tageZwischen(ns, ne)+1) * ganttState.pxProTag);
        d.bar.style.width = w + "px";
      }
      d._ns = ns; d._ne = ne;
    });
    window.addEventListener("mouseup", () => {
      const d = ganttState.drag; if(!d){ document.body.style.userSelect=""; return; }
      ganttState.drag = null;
      document.body.style.userSelect = "";
      if(!d.moved || !d._ns) return;
      const t = tickets.find(x=>x.id===d.id); if(!t) return;
      t.start = fmtISO(d._ns); t.end = fmtISO(d._ne);
      t.updated = jetztTs();
      if(backendConfigured()) enqueue("Termin: " + (t.title||""), [ opUpdate(TAB_TICKETS, "id", t.id, ticketToRow(t)) ]);
      renderGantt();
    });
  }
}

// Wandelt "YYYY-MM-DD HH:MM" oder "YYYY-MM-DD" in einen Zeitstempel (ms) um.
function tsToMs(s){
  if(!s) return 0;
  let t = String(s).trim();
  const m = t.match(/^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2})/);
  if(m){ t = `${m[1]}T${String(m[2]).padStart(2,"0")}:${m[3]}`; }
  else { t = t.replace(" ", "T"); }
  const d = new Date(t);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}
function zeitHer(ms){
  if(!ms) return "";
  const diff = Date.now() - ms;
  const min = Math.floor(diff/60000), std = Math.floor(min/60), tag = Math.floor(std/24);
  if(min < 1) return "gerade eben";
  if(min < 60) return `vor ${min} Min`;
  if(std < 24) return `vor ${std} Std`;
  if(tag < 30) return `vor ${tag} Tag${tag>1?"en":""}`;
  const mon = Math.floor(tag/30);
  return `vor ${mon} Monat${mon>1?"en":""}`;
}
const FRISCH_TAGE = 3;
function frischeBadge(t){
  const cMs = tsToMs(t.created), uMs = tsToMs(t.updated);
  const juengste = Math.max(cMs||0, uMs||0);
  if(!juengste) return "";
  const grenze = Date.now() - 8*3600000;
  if(juengste < grenze) return "";
  const istNeu = cMs && cMs >= grenze && (!uMs || Math.abs(uMs - cMs) < 60000);
  const titel = istNeu ? `Erstellt ${zeitHer(cMs)}` : `Aktualisiert ${zeitHer(juengste)}`;
  return `<span class="fresh-dot" title="${titel}"></span>`;
}
function renderCard(t){
  const c = document.createElement("div");
  // Blockiert-Zustand: mind. ein offener Blocker
  const offen = offeneBlocker(t);
  const activeBlock = offen.length > 0;
  c.className = "card" + (activeBlock?" blocked":"") + (t.status==="Done"?" done":"");
  c.draggable = true;
  c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", t.id); e.dataTransfer.effectAllowed="move"; });
  c.onclick = () => openTicket(t.id);

  const subDone = t.subtasks.filter(s=>s.done).length;
  const meta = [];
  if(t.subtasks.length) meta.push(`<span class="ic" title="Subtasks erledigt">☑ ${subDone}/${t.subtasks.length}</span>`);
  if(t.updates.length)  meta.push(`<span class="ic" title="Updates">💬 ${t.updates.length}</span>`);

  // Tags nur als farbige Punkte (Name im Tooltip)
  const tagsHtml = (t.tags && t.tags.length)
    ? `<div class="tag-dots">${t.tags.map(nm=>{ const tg=tagByName(nm); return `<span class="tag-dot" style="background:${tg.color||'var(--muted-hell)'};" title="${esc(nm)}"></span>`; }).join("")}</div>`
    : "";

  // Owner als Initialen-Kreise
  const ownersHtml = (t.owners && t.owners.length)
    ? `<div class="avatars">${t.owners.map(o=>`<span class="avatar" title="${esc(o)}">${esc(initialen(o))}</span>`).join("")}</div>`
    : "";

  // Blockiert-Indikator: ⛔ mit Anzahl; öffnet den (ersten) Blocker
  const blockHtml = activeBlock
    ? `<span class="blk-dot" data-block="${esc(offen[0].id)}" title="Blockiert von: ${esc(offen.map(b=>b.title||b.id).join(', '))}">⛔${offen.length>1?`<span class="blk-cnt">${offen.length}</span>`:""}</span>`
    : "";

  c.innerHTML = `
    <div class="card-top">
      <div class="card-title">${frischeBadge(t)}${esc(t.title)}</div>
      ${tagsHtml}
    </div>
    ${t.goal ? `<div class="card-goal">${mdPreview(t.goal)}</div>` : ""}
    <div class="card-foot">
      ${ownersHtml}
      <div class="foot-right">
        ${blockHtml}
        ${meta.length?`<span class="card-meta">${meta.join(" ")}</span>`:""}
      </div>
    </div>`;

  // Klick auf den Blockier-Punkt öffnet den ersten offenen Blocker
  const blk = c.querySelector(".blk-dot");
  if(blk){
    blk.addEventListener("click", e => {
      e.stopPropagation();
      const bid = blk.dataset.block;
      if(tickets.some(x => x.id === bid)) openTicket(bid);
    });
  }
  return c;
}
// Initialen aus einem Namen (max. 2 Buchstaben)
function initialen(name){
  const teile = String(name||"").trim().split(/\s+/);
  if(teile.length >= 2) return (teile[0][0]+teile[teile.length-1][0]).toUpperCase();
  return String(name||"").trim().slice(0,2).toUpperCase();
}

function blankTicket(){

  return { id:null, title:"", goal:"", desc:"", start:fmt(heute), end:fmt(inWoche), prio:"Mittel", status:DEFAULT_STATUS, owners:[], tags:[], stakeholder:"", blockedBy:[], created:"", updated:"", subtasks:[], updates:[] };
}

function renderMetaFields(){
  if(!Array.isArray(editing.tags)) editing.tags = [];
  renderMsel({
    id:"mselPrio", multi:false, placeholder:"Priorität …",

  });
  renderMsel({
    id:"mselOwners", multi:true, placeholder:"Owner wählen …",
    options: owners.map(o => ({ value:o, label:o })),
    selected: () => editing.owners,
    toggle: v => { const i=editing.owners.indexOf(v); i>=0?editing.owners.splice(i,1):editing.owners.push(v); renderMetaFields(); },
  });
  renderMsel({

    options: owners.map(o => ({ value:o, label:o })),
    selected: () => editing.stakeholder ? [editing.stakeholder] : [],
    toggle: v => { editing.stakeholder = (editing.stakeholder===v ? "" : v); renderMetaFields(); },
  });
  // Tag: Einzelauswahl aus dem Tags-Tab (mit Farbe)
  const aktTag = (editing.tags && editing.tags.length) ? editing.tags[0] : "";
  renderMsel({
    id:"mselTag", multi:false, placeholder: tags.length ? "Tag wählen …" : "Keine Tags im Sheet",
    options: tags.map(t => ({ value:t.name, label:t.name, color:t.color })),
    selected: () => aktTag ? [aktTag] : [],
    toggle: v => { editing.tags = (aktTag===v) ? [] : [v]; renderMetaFields(); },
  });
  // Blocked by: alle anderen Tickets als Optionen (sich selbst ausschließen)
  if(!Array.isArray(editing.blockedBy)) editing.blockedBy = editing.blockedBy ? [editing.blockedBy] : [];
  const blockOptions = tickets
    .filter(t => t.id && t.id !== editing.id)
    .map(t => ({ value:t.id, label:t.title || t.id }));
  renderMsel({
    id:"mselBlockedBy", multi:true, searchable:true, searchPlaceholder:"Ticket suchen …",
    placeholder: blockOptions.length ? "Blockierende Tickets wählen …" : "Keine anderen Tickets",
    options: blockOptions,
    selected: () => editing.blockedBy,
    toggle: v => { const i=editing.blockedBy.indexOf(v); i>=0?editing.blockedBy.splice(i,1):editing.blockedBy.push(v); renderMetaFields(); },
  });
  // Hinweis: wie viele der Blocker noch offen sind
  const hint = $("#blkHint");
  if(hint){
    const blocker = editing.blockedBy.map(id => tickets.find(t=>t.id===id)).filter(Boolean);
    const offen = blocker.filter(b => b.status !== "Done").length;
    if(!blocker.length){ hint.textContent = ""; hint.className = "blk-hint"; }
    else if(offen === 0){ hint.textContent = "· alle erledigt ✓"; hint.className = "blk-hint done"; }
    else { hint.textContent = `· ${offen} offen`; hint.className = "blk-hint"; }
  }
}

/* Generischer Auswahl-Dropdown (Single/Multi) für die Meta-Zeile */
function renderMsel(cfg){
  const root = document.getElementById(cfg.id); if(!root) return;
  const trigger = root.querySelector(".msel-trigger");
  const vals = root.querySelector(".msel-vals");
  const panel = root.querySelector(".msel-panel");
  const sel = cfg.selected();

  // Chips im Trigger
  vals.innerHTML = "";
  if(!sel.length){ vals.innerHTML = `<span class="msel-ph">${esc(cfg.placeholder)}</span>`; }
  else sel.forEach(v => {
    const opt = cfg.options.find(o => o.value === v);
    const chip = document.createElement("span");
    if(opt && opt.color){ chip.className = "msel-chip tag"; chip.setAttribute("style", tagChipStyle(opt.color)); }
    else chip.className = "msel-chip";
    chip.textContent = opt ? opt.label : v;
    vals.appendChild(chip);
  });

  // Optionen im Panel (bei searchable mit vorangestelltem Suchfeld)
  panel.innerHTML = "";
  let searchInput = null, optWrap = panel;
  if(cfg.searchable){
    const box = document.createElement("div"); box.className = "msel-search-box";
    searchInput = document.createElement("input");
    searchInput.className = "msel-search"; searchInput.type = "search";
    searchInput.placeholder = cfg.searchPlaceholder || "Suchen …"; searchInput.autocomplete = "off";
    box.appendChild(searchInput); panel.appendChild(box);
    optWrap = document.createElement("div"); optWrap.className = "msel-opts"; panel.appendChild(optWrap);
  }

  function drawOptions(filter){
    optWrap.innerHTML = "";
    const q = (filter||"").trim().toLowerCase();
    if(!cfg.options.length){ optWrap.innerHTML = `<div class="msel-none">Keine Einträge</div>`; return; }
    const list = q ? cfg.options.filter(o => o.label.toLowerCase().includes(q)) : cfg.options;
    if(!list.length){ optWrap.innerHTML = `<div class="msel-none">Nichts gefunden</div>`; return; }
    list.forEach(o => {
      const row = document.createElement("div");
      row.className = "msel-opt" + (cfg.multi?"":" round") + (sel.includes(o.value)?" sel":"");
      const boxStyle = (o.color && sel.includes(o.value)) ? ` style="background:${o.color};border-color:${o.color};"` : "";
      row.innerHTML = `<span class="box"${boxStyle}></span>${esc(o.label)}`;
      row.onclick = e => { e.stopPropagation(); cfg.toggle(o.value); if(!cfg.multi) closeAllMsel(); };
      optWrap.appendChild(row);
    });
  }
  drawOptions("");

  if(searchInput){
    searchInput.addEventListener("input", () => drawOptions(searchInput.value));
    searchInput.addEventListener("click", e => e.stopPropagation());
    searchInput.addEventListener("keydown", e => {
      if(e.key === "Escape"){ e.stopPropagation(); closeAllMsel(); }
      // Enter wählt den einzigen verbleibenden Treffer
      if(e.key === "Enter"){
        const q = searchInput.value.trim().toLowerCase();
        const hits = q ? cfg.options.filter(o => o.label.toLowerCase().includes(q)) : cfg.options;
        if(hits.length === 1){ e.preventDefault(); cfg.toggle(hits[0].value); if(!cfg.multi) closeAllMsel(); }
      }
    });
  }

  // Trigger-Klick (nur einmal binden)
  if(!trigger._bound){
    trigger._bound = true;
    trigger.onclick = e => {
      e.stopPropagation();
      const wasOpen = root.classList.contains("open");
      closeAllMsel();
      if(!wasOpen){
        root.classList.add("open");
        // Suchfeld beim Öffnen fokussieren
        const si = panel.querySelector(".msel-search");
        if(si){ si.value = ""; setTimeout(() => si.focus(), 20); }
      }
    };
    panel.addEventListener("click", e => e.stopPropagation());
  }
}
function closeAllMsel(){ document.querySelectorAll(".msel.open").forEach(m => m.classList.remove("open")); }

let subDragId = null;   // aktuell gezogener Subtask (für Drag&Drop-Sortierung)

function renderSubtasks(){
  const list = $("#subList"); list.innerHTML = "";
  editing.subtasks.forEach(s => {
    if(!Array.isArray(s.owners)) s.owners = [];
    const row = document.createElement("div");
    row.className = "sub-item" + (s.done?" done":"");
    row.dataset.sid = s.id;

    // Drag-Handle (nur dieses Element ist ziehbar, damit Text-Auswahl etc. normal bleibt)
    const grip = document.createElement("span");
    grip.className = "sub-drag"; grip.textContent = "⠿"; grip.title = "Ziehen zum Sortieren";
    grip.draggable = true;
    grip.addEventListener("dragstart", e => {
      subDragId = s.id; row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", s.id); } catch(_){}
    });
    grip.addEventListener("dragend", () => {
      subDragId = null; row.classList.remove("dragging");
      list.querySelectorAll(".sub-item").forEach(r => r.classList.remove("drop-above","drop-below"));
    });

    const cb = document.createElement("span"); cb.className = "cb" + (s.done?" done":"");
    cb.onclick = () => { s.done=!s.done; renderSubtasks(); };

    const txt = document.createElement("span"); txt.className = "sub-txt"; txt.textContent = s.text;
    txt.title = "Klicken zum Bearbeiten";
    txt.onclick = () => startEditSubtask(s.id);

    // Owner-Chip + Dropdown
    const own = document.createElement("div"); own.className = "sub-own";
    const btn = document.createElement("button");
    btn.className = "sub-own-btn" + (s.owners.length?"":" empty");
    btn.innerHTML = s.owners.length ? esc(s.owners.join(", ")) : "+ Owner";
    const panel = document.createElement("div"); panel.className = "sub-own-panel";
    owners.forEach(o => {
      const r = document.createElement("div");
      r.className = "dd-opt" + (s.owners.includes(o)?" sel":"");
      r.innerHTML = `<span class="box"></span>${esc(o)}`;
      r.onclick = e => { e.stopPropagation(); const i=s.owners.indexOf(o); i>=0?s.owners.splice(i,1):s.owners.push(o); renderSubtasks(); openSubOwnerPanel(s.id); };
      panel.appendChild(r);
    });
    btn.onclick = e => { e.stopPropagation(); const wasOpen=panel.classList.contains("open"); closeAllSubPanels(); if(!wasOpen) panel.classList.add("open"); };
    panel.dataset.sid = s.id;
    own.appendChild(btn); own.appendChild(panel);

    const del = document.createElement("button"); del.className = "sub-del"; del.textContent = "×";
    del.onclick = () => { editing.subtasks = editing.subtasks.filter(x=>x!==s); renderSubtasks(); };

    // Drop-Ziel: die ganze Zeile reagiert auf darüber gezogene Subtasks
    row.addEventListener("dragover", e => {
      if(!subDragId || subDragId === s.id) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      row.classList.toggle("drop-above", before);
      row.classList.toggle("drop-below", !before);
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-above","drop-below"));
    row.addEventListener("drop", e => {
      if(!subDragId || subDragId === s.id) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      moveSubtask(subDragId, s.id, before);
    });

    row.append(grip, cb, txt, own, del);
    list.appendChild(row);
  });
  const done = editing.subtasks.filter(s=>s.done).length;
  $("#subCount").textContent = editing.subtasks.length ? `${done}/${editing.subtasks.length}` : "";
}

// Subtask "dragId" vor/nach "targetId" einsortieren
function moveSubtask(dragId, targetId, before){
  const arr = editing.subtasks;
  const from = arr.findIndex(x => x.id === dragId);
  if(from < 0) return;
  const [moved] = arr.splice(from, 1);
  let to = arr.findIndex(x => x.id === targetId);
  if(to < 0){ arr.push(moved); }
  else { if(!before) to += 1; arr.splice(to, 0, moved); }
  renderSubtasks();
}

// Subtask-Text inline bearbeiten
function startEditSubtask(sid){
  const s = editing.subtasks.find(x => x.id === sid); if(!s) return;
  const row = $(`.sub-item[data-sid="${sid}"]`); if(!row) return;
  const txt = row.querySelector(".sub-txt"); if(!txt) return;
  const input = document.createElement("input");
  input.className = "sub-edit"; input.value = s.text; input.autocomplete = "off";
  const commit = () => { const v = input.value.trim(); if(v) s.text = v; renderSubtasks(); };
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); commit(); }
    else if(e.key === "Escape"){ e.preventDefault(); renderSubtasks(); }
  });
  input.addEventListener("blur", commit);
  txt.replaceWith(input);
  input.focus(); input.select();
}

let updEditingId = null;   // Update, das gerade bearbeitet wird

function renderUpdates(){
  const list = $("#updList"); list.innerHTML = "";
  editing.updates.slice().reverse().forEach(u => {
    const d = document.createElement("div");
    d.className = "upd";

    if(updEditingId === u.id){
      // Bearbeitungsmodus: Rich-Text-Editor mit Speichern/Abbrechen
      const editedTxt = u.edited ? `<span class="upd-edited">· bearbeitet</span>` : "";
      d.innerHTML = `<div class="upd-meta">${esc(u.author||"—")} · ${esc(u.ts||"")} ${editedTxt}</div>
        <div class="upd-edit-wrap">
          <div class="rte-wrap" data-rte="updedit">
            <div class="rte-bar"></div>
            <div class="rte sm" contenteditable="true" data-placeholder="Update bearbeiten …"></div>
          </div>
          <div class="upd-edit-actions">
            <button type="button" class="save">Speichern</button>
            <button type="button" class="cancel">Abbrechen</button>
          </div>
        </div>`;
      list.appendChild(d);
      const wrap = d.querySelector(".rte-wrap");
      const ed = wrap.querySelector(".rte");
      initRte(wrap);
      rteSet(ed, u.text);
      ed.focus();
      d.querySelector(".save").onclick = () => {
        const v = rteGet(ed).trim();
        if(v){ u.text = v; u.edited = true; }
        updEditingId = null; renderUpdates();
      };
      d.querySelector(".cancel").onclick = () => { updEditingId = null; renderUpdates(); };
      return;
    }

    const editedTxt = u.edited ? `<span class="upd-edited">· bearbeitet</span>` : "";
    d.innerHTML = `<div class="upd-meta">${esc(u.author||"—")} · ${esc(u.ts||"")} ${editedTxt}
        <span class="upd-actions">
          <button type="button" class="edit">Bearbeiten</button>
          <button type="button" class="del">Löschen</button>
        </span>
      </div>
      <div class="upd-text md">${mdToHtml(u.text)}</div>`;
    d.querySelector(".edit").onclick = () => { updEditingId = u.id; renderUpdates(); };
    d.querySelector(".del").onclick = () => {
      if(confirm("Dieses Update löschen?")){
        editing.updates = editing.updates.filter(x => x !== u);
        if(updEditingId === u.id) updEditingId = null;
        renderUpdates();
      }
    };
    list.appendChild(d);
  });
}

function addUpdate(){
  const ed = $("#updInput"); const v = rteGet(ed).trim(); if(!v) return;
  const sel = $("#updAuthor");
  const autor = sel ? sel.value : "";
  // Autor ist Pflicht: ohne Auswahl kurz das Feld markieren und abbrechen
  if(!autor){
    const wrap = $("#updAuthorWrap");
    if(wrap){ wrap.classList.add("missing"); setTimeout(()=>wrap.classList.remove("missing"), 1500); }
    if(sel) sel.focus();
    return;
  }
  letzterAutor = autor;
  const ts = new Date().toISOString().slice(0,16).replace("T"," ");
  editing.updates.push({ id:"u"+Math.random().toString(36).slice(2,7), author:autor, ts, text:v, edited:false });
  rteSet(ed, ""); renderUpdates();
}

    msg.textContent = "Bitte prüfen: " + fehlt.join(", ");

    return;

  saveTicket(editing, editSnapshot);
  closeDialog(); renderCurrentView();
}

/* ===== Ticket-Deep-Links (URL-Hash, GitHub-Pages-tauglich) ===== */
function setHashTicket(id){
  const neu = "#ticket=" + encodeURIComponent(id);
  if(location.hash !== neu){ history.replaceState(null, "", location.pathname + location.search + neu); }
}
function clearHash(){
  if(location.hash.startsWith("#ticket=")){ history.replaceState(null, "", location.pathname + location.search); }
}
function ticketIdFromHash(){
  const m = location.hash.match(/^#ticket=(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}
// Öffnet das im Hash genannte Ticket — sobald die Daten geladen sind.
function openTicketFromHash(){
  const id = ticketIdFromHash();
  if(!id) return;
  const t = tickets.find(x => x.id === id);
  if(t){ openTicket(id); }
  else {
    // Ticket nicht (mehr) vorhanden: sauberer Hinweis statt stiller Fehler
    clearHash();
    zeigeToast("Dieses Ticket existiert nicht mehr oder wurde noch nicht geladen.");
  }
}

window.addEventListener("hashchange", () => {
  const id = ticketIdFromHash();
  if(id){ if(!$("#overlay").classList.contains("open")) openTicketFromHash(); }
  else if($("#overlay").classList.contains("open")){ closeDialog(); }
});

}
