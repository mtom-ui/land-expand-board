/* ===================== RICH-TEXT (Markdown ⇄ HTML) ===================== */
/* Gespeichert wird Markdown. Im Editor als HTML gerendert, beim Speichern zurück. */
function mdInline(s){
  s = s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  // Markdown-Links [Text](URL) -> <a>
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (m, txt, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`);
  // Nackte URLs klickbar machen — aber nicht solche, die schon in einem <a href="…"> stehen
  s = s.replace(/(^|[^"=\/])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,
    (m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
  return s;
}
function mdToHtml(text){
  const lines = esc(text||"").split(/\r?\n/);
  let html = "", i = 0;
  const indentW = s => s.replace(/\t/g,"  ").length;
  function parseList(indent){
    const type = /\d+\./.test(lines[i].match(/^(\s*)([-*]|\d+\.)\s+/)[2]) ? "ol" : "ul";
    html += "<"+type+">";
    while(i < lines.length){
      const lm = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(!lm) break;
      const ind = indentW(lm[1]);
      if(ind < indent) break;
      if(ind > indent){ parseList(ind); continue; }
      const thisType = /\d+\./.test(lm[2]) ? "ol" : "ul";
      if(thisType !== type) break;
      html += `<li>${mdInline(lm[3])}`;
      i++;
      if(i < lines.length){ const nm = lines[i].match(/^(\s*)([-*]|\d+\.)\s+/); if(nm && indentW(nm[1]) > indent) parseList(indentW(nm[1])); }
      html += "</li>";
    }
    html += "</"+type+">";
  }
  while(i < lines.length){
    const line = lines[i];
    let m;
    if(line.match(/^\s*&gt;\s?/)){
      html += "<blockquote>";
      while(i < lines.length && (m = lines[i].match(/^\s*&gt;\s?(.*)$/))){ html += `<div>${mdInline(m[1]) || "<br>"}</div>`; i++; }
      html += "</blockquote>"; continue;
    }
    if(line.match(/^(\s*)([-*]|\d+\.)\s+/)){ parseList(indentW(line.match(/^(\s*)/)[1])); continue; }
    if(line.trim()===""){ html += "<div><br></div>"; i++; continue; }
    html += `<div>${mdInline(line)}</div>`; i++;
  }
  return html;
}
function htmlToMd(root){
  function inline(node){
    let s="";
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){ s+=n.nodeValue.replace(/\u00a0/g," "); return; }
      if(n.nodeType!==1) return;
      const tag=n.nodeName.toLowerCase();
      if(tag==="br"){ s+="\n"; return; }
      const inner=inline(n);
      if(tag==="strong"||tag==="b") s+= inner?("**"+inner+"**"):"";
      else if(tag==="em"||tag==="i") s+= inner?("*"+inner+"*"):"";
      else if(tag==="code") s+= inner?("`"+inner+"`"):"";
      else if(tag==="a"){ const href=n.getAttribute("href")||""; if(href && inner){ s+= (inner===href) ? href : `[${inner}](${href})`; } else s+=inner; }
      else if(tag==="span"){ const st=(n.getAttribute("style")||"").toLowerCase(); let x=inner; if(/italic/.test(st))x="*"+x+"*"; if(/bold|[6-9]00/.test(st))x="**"+x+"**"; s+=x; }
      else if(tag==="ul"||tag==="ol"){ /* separat als Block */ }
      else s+=inner;
    });
    return s;
  }
  // Wie inline(), aber für einen EINZELNEN Knoten (Textknoten ODER Inline-Element),
  // der direkt übergeben wird — inline() selbst liest nur die Kinder eines Elements.
  function inlineNode(n){
    if(n.nodeType===3) return n.nodeValue.replace(/\u00a0/g," ");
    if(n.nodeType!==1) return "";
    const tag=n.nodeName.toLowerCase();
    if(tag==="br") return "\n";
    const inner=inline(n);
    if(tag==="strong"||tag==="b") return inner?("**"+inner+"**"):"";
    if(tag==="em"||tag==="i") return inner?("*"+inner+"*"):"";
    if(tag==="code") return inner?("`"+inner+"`"):"";
    if(tag==="span"){ const st=(n.getAttribute("style")||"").toLowerCase(); let x=inner; if(/italic/.test(st))x="*"+x+"*"; if(/bold|[6-9]00/.test(st))x="**"+x+"**"; return x; }
    return inner;
  }
  const lines=[];
  const BLOECKE = "ul,ol,blockquote,div,p";
  const hatBlock = n => !!(n.querySelector && n.querySelector(BLOECKE));
  function listBlock(node, ordered, depth){
    const pad="  ".repeat(depth); let idx=1;
    [...node.children].forEach(el=>{
      const t=el.nodeName.toLowerCase();
      if(t==="li"){
        lines.push(pad + (ordered ? (idx++)+". " : "- ") + inline(el).trim());
        [...el.children].forEach(ch=>{ if(ch.nodeName==="UL"||ch.nodeName==="OL") listBlock(ch, ch.nodeName==="OL", depth+1); });
      } else if(t==="ul"){ listBlock(el,false,depth+1); }
      else if(t==="ol"){ listBlock(el,true,depth+1); }
    });
  }
  const INLINE_TAGS = "b,strong,i,em,code,span,a,u,s,sub,sup,font,mark,small";
  const istInline = n => n.nodeType===3 || (n.nodeType===1 && INLINE_TAGS.split(",").includes(n.nodeName.toLowerCase()) && !hatBlock(n));
  function block(container){
    let inlineBuf = "";   // sammelt aufeinanderfolgende Inline-Knoten/Text zu EINER Zeile
    const flushInline = () => { if(inlineBuf!==""){ const t=inlineBuf.replace(/\n+$/,""); if(t!=="") lines.push(t); inlineBuf=""; } };
    container.childNodes.forEach(n=>{
      // Inline-Knoten (Text, <b>, <i>, <code>, <span> …) puffern, damit "Text <b>fett</b>"
      // als eine Zeile "Text **fett**" herauskommt statt in zwei Zeilen zu zerfallen.
      if(istInline(n)){ inlineBuf += inlineNode(n); return; }
      flushInline();
      if(n.nodeType!==1) return;
      const tag=n.nodeName.toLowerCase();
      if(tag==="ul"){ listBlock(n,false,0); }
      else if(tag==="ol"){ listBlock(n,true,0); }
      else if(tag==="blockquote"){ const von=lines.length; block(n); for(let k=von;k<lines.length;k++) lines[k]=("> "+lines[k]).replace(/\s+$/,""); }
      else if(tag==="div"||tag==="p"){ if(hatBlock(n)){ block(n); } else { lines.push(inline(n).replace(/\n+$/,"")); } }
      else if(tag==="br"){ lines.push(""); }
      else if(hatBlock(n)){ block(n); }
      else { const t=inline(n); if(t) lines.push(t); }
    });
    flushInline();
  }
  block(root);
  return lines.join("\n").replace(/^\n+/,"").replace(/\n+$/,"");
}
// Einzeilige Vorschau für Karten
function mdPreview(text){
  let s = esc(text||"")
    .replace(/^\s*&gt;\s?/gm, "» ")
    .replace(/^\s*([-*]|\d+\.)\s+/gm, "• ")
    .replace(/\n+/g, " ");
  // In der Karten-Vorschau: Markdown-Links auf ihren Text reduzieren (kein aktiver Link,
  // damit der Klick das Ticket öffnet statt zu navigieren)
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, "$1");
  return s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

/* Editor-Verhalten */
function rteExec(cmd,val){ try{ document.execCommand("styleWithCSS",false,false); }catch(_){} document.execCommand(cmd,false,val||null); }
// Link einfügen (aus markiertem Text) oder entfernen (Cursor im Link)
function rteLink(ed){
  const sel = window.getSelection();
  // Steht die Auswahl in einem bestehenden Link? -> entfernen
  let node = sel && sel.anchorNode;
  let aTag = null;
  while(node && node !== ed){ if(node.nodeName === "A"){ aTag = node; break; } node = node.parentNode; }
  if(aTag){ rteExec("unlink"); return; }

  const auswahl = sel ? sel.toString() : "";
  let url = prompt("Link-URL:", "https://");
  if(!url) return;
  url = url.trim();
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;   // Schema ergänzen
  if(auswahl){
    // markierten Text verlinken
    rteExec("createLink", url);
    // target/rel setzen für neu erzeugten Link
    const a = sel.anchorNode && (sel.anchorNode.parentNode?.closest?.("a"));
    ed.querySelectorAll('a[href="'+url+'"]').forEach(el => { el.target="_blank"; el.rel="noopener noreferrer"; });
  } else {
    // kein Text markiert: Linktext erfragen und einfügen
    const text = prompt("Anzeigetext:", url) || url;
    const html = `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>&nbsp;`;
    document.execCommand("insertHTML", false, html);
  }
}
function rteVorfahr(ed, test){ let n=window.getSelection().anchorNode; while(n && n!==ed){ if(n.nodeType===1 && test(n)) return n; n=n.parentNode; } return null; }
function rteBlockAm(ed){ let n=window.getSelection().anchorNode; while(n && n!==ed){ if(n.nodeType===1 && /^(DIV|P|LI|BLOCKQUOTE)$/.test(n.nodeName)) return n; n=n.parentNode; } return null; }
function rteQuoteToggle(ed){
  const bq = rteVorfahr(ed, el=>el.nodeName==="BLOCKQUOTE");
  if(bq){ // auflösen: Kinder vor blockquote schieben
    while(bq.firstChild) bq.parentNode.insertBefore(bq.firstChild, bq);
    bq.remove();
  } else {
    try{ document.execCommand("formatBlock",false,"<blockquote>"); }catch(_){}
  }
  ed.dispatchEvent(new Event("input"));
}
function rtePlaceholder(ed){ const empty=!ed.textContent.trim() && !ed.querySelector("ul,ol"); ed.classList.toggle("is-empty", empty); }
function rteSet(ed, md){ ed.innerHTML = md ? mdToHtml(md) : ""; rtePlaceholder(ed); }
function rteGet(ed){ return htmlToMd(ed); }

// Liste anlegen (aus normalem Text heraus)
function rteListe(ed, ordered){ rteExec(ordered ? "insertOrderedList" : "insertUnorderedList"); }

// ===== Ein- und Ausrücken von Listenpunkten =====
// Nicht via execCommand("indent"): Chrome erzeugt daraus ungültiges <ul><ul> und
// verschmilzt Punkte. Wir hängen den <li> selbst um.
function rteCurrentLi(ed){ let n=window.getSelection().anchorNode; while(n && n!==ed){ if(n.nodeType===1 && n.nodeName==="LI") return n; n=n.parentNode; } return null; }
function rteIndentLi(ed){
  const li = rteCurrentLi(ed); if(!li) return false;
  const prev = li.previousElementSibling;
  if(!prev || prev.nodeName!=="LI") return false;      // erster Punkt kann nicht rutschen
  let sub = prev.lastElementChild;
  if(!sub || (sub.nodeName!=="UL" && sub.nodeName!=="OL")){
    sub = document.createElement(li.parentNode.nodeName);  // gleiche Listenart
    prev.appendChild(sub);
  }
  sub.appendChild(li);
  return true;
}
function rteOutdentLi(ed){
  const li = rteCurrentLi(ed); if(!li) return false;
  const liste = li.parentNode;
  const elternLi = liste.parentNode;
  if(!elternLi || elternLi.nodeName!=="LI") return false;   // schon ganz außen
  const rest = [...liste.children].slice([...liste.children].indexOf(li) + 1);
  elternLi.parentNode.insertBefore(li, elternLi.nextSibling);
  if(rest.length){
    let sub = li.lastElementChild;
    if(!sub || (sub.nodeName!=="UL" && sub.nodeName!=="OL")){ sub = document.createElement(liste.nodeName); li.appendChild(sub); }
    rest.forEach(r=> sub.appendChild(r));
  }
  if(!liste.children.length) liste.remove();
  return true;
}
// Umbau ausführen und Cursor an derselben Stelle wiederherstellen
function rteMitCursor(fn){
  const sel = window.getSelection();
  if(!sel.rangeCount) return false;
  const r = sel.getRangeAt(0), knoten = r.startContainer, pos = r.startOffset;
  const ok = fn();
  if(ok) try {
    const max = knoten.nodeType===3 ? knoten.nodeValue.length : knoten.childNodes.length;
    const neu = document.createRange();
    neu.setStart(knoten, Math.min(pos, max)); neu.collapse(true);
    sel.removeAllRanges(); sel.addRange(neu);
  } catch(_){}
  return ok;
}
function rteShiftLi(ed, raus){ return rteMitCursor(()=> raus ? rteOutdentLi(ed) : rteIndentLi(ed)); }

// Tippt man "- ", "* ", "1. " oder "> " am Zeilenanfang, wird das Kürzel entfernt
// und der Block umgewandelt. Rückgabe true = Leerzeichen verschlucken.
function rteSpace(ed){
  const sel=window.getSelection(); if(!sel.rangeCount) return false;
  const r=sel.getRangeAt(0); if(!r.collapsed) return false;
  const blk = rteBlockAm(ed);
  if(blk && blk.nodeName==="LI") return false;   // in Listen kein erneutes Triggern
  let before;
  try{
    const pre=r.cloneRange();
    if(blk) pre.setStart(blk,0); else pre.setStart(ed,0);
    before=pre.toString();
  }catch(_){ return false; }
  let trigger=null;
  if(before==="-"||before==="*"||before==="•") trigger="ul";
  else if(/^\d+\.$/.test(before)) trigger="ol";
  else if(before===">") trigger="quote";
  if(!trigger) return false;
  for(let i=0;i<before.length;i++) document.execCommand("delete", false, null);
  if(trigger==="ul") rteListe(ed,false);
  else if(trigger==="ol") rteListe(ed,true);
  else if(trigger==="quote") rteQuoteToggle(ed);
  return true;
}
// Enter in leerem Listenpunkt / leerem Zitat → Block verlassen
function rteEnter(ed){
  const li = rteVorfahr(ed, el=>el.nodeName==="LI");
  if(li && !li.textContent.trim()){
    rteExec(li.parentNode.nodeName==="OL" ? "insertOrderedList" : "insertUnorderedList"); // Liste beenden
    return true;
  }
  const bq = rteVorfahr(ed, el=>el.nodeName==="BLOCKQUOTE");
  if(bq){
    const cur = rteBlockAm(ed);
    if(cur && cur.nodeName!=="LI" && !cur.textContent.trim()){ rteQuoteToggle(ed); return true; }
  }
  return false;
}

const RTE_TOOLS = [
  { cmd:"bold",   ic:"B",  title:"Fett", style:"font-weight:700" },
  { cmd:"italic", ic:"I",  title:"Kursiv", style:"font-style:italic" },
  { cmd:"link",   ic:"🔗", title:"Link einfügen/entfernen" },
  { sep:true },
  { cmd:"ul",     ic:"•",  title:"Aufzählung" },
  { cmd:"ol",     ic:"1.", title:"Nummerierte Liste", style:"font-size:11px" },
  { cmd:"quote",  ic:"❝",  title:"Zitat" },
];
function buildRteBar(wrap){
  const ed = wrap.querySelector(".rte");
  const bar = wrap.querySelector(".rte-bar");
  bar.innerHTML = "";
  RTE_TOOLS.forEach(t => {
    if(t.sep){ const s=document.createElement("span"); s.className="sep"; bar.appendChild(s); return; }
    const b = document.createElement("button");
    b.type="button"; b.title=t.title; b.textContent=t.ic; if(t.style) b.setAttribute("style", t.style);
    b.addEventListener("mousedown", e => e.preventDefault()); // Fokus im Editor halten
    b.onclick = () => {
      ed.focus();
      if(t.cmd==="bold"||t.cmd==="italic") rteExec(t.cmd);
      else if(t.cmd==="ul") rteExec("insertUnorderedList");
      else if(t.cmd==="ol") rteExec("insertOrderedList");
      else if(t.cmd==="quote") rteQuoteToggle(ed);
      else if(t.cmd==="link") rteLink(ed);
      rtePlaceholder(ed); syncRteBar(wrap);
    };
    bar.appendChild(b);
  });
}
function syncRteBar(wrap){
  const bar = wrap.querySelector(".rte-bar");
  const btns = bar.querySelectorAll("button");
  const state = { bold:document.queryCommandState("bold"), italic:document.queryCommandState("italic") };
  let idx=0;
  RTE_TOOLS.forEach(t=>{ if(t.sep) return; const b=btns[idx++]; if(!b) return;
    let on=false;
    if(t.cmd==="bold") on=state.bold;
    else if(t.cmd==="italic") on=state.italic;
    b.classList.toggle("on", on);
  });
}
function initRte(wrap){
  const ed = wrap.querySelector(".rte");
  buildRteBar(wrap);
  try{ document.execCommand("defaultParagraphSeparator", false, "div"); }catch(_){}
  ed.addEventListener("keydown", e => {
    if(e.key==="Tab"){
      const li = rteCurrentLi(ed);
      if(li){ e.preventDefault(); if(rteShiftLi(ed, e.shiftKey)) ed.dispatchEvent(new Event("input")); return; }
      // außerhalb einer Liste: Tab normal lassen (Fokuswechsel)
      return;
    }
    if(e.key===" "){ try{ if(rteSpace(ed)){ e.preventDefault(); rtePlaceholder(ed); } }catch(_){} return; }
    if(e.key==="Enter" && !e.shiftKey){ try{ if(rteEnter(ed)){ e.preventDefault(); rtePlaceholder(ed); } }catch(_){} return; }
  });
  ed.addEventListener("input", ()=> rtePlaceholder(ed));
  ed.addEventListener("keyup", ()=> syncRteBar(wrap));
  ed.addEventListener("mouseup", ()=> syncRteBar(wrap));
  rtePlaceholder(ed);
}



/* ===================== UTIL ===================== */
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
// Tag-Objekt zum Namen finden; Chip-Style aus der Farbe bauen
function tagByName(name){ return tags.find(t => t.name === name) || { name, color:"" }; }
function tagChipStyle(color){
  const c = color || "#8B959A";
  return `color:${c};border-color:${c};background:color-mix(in srgb, ${c} 12%, transparent);`;
}

/* ===================== INIT ===================== */
document.querySelectorAll(".rte-wrap").forEach(initRte);

/* ===== Zuletzt aktualisiert + Auto-Refresh ===== */
let lastFetch = 0;
const AUTO_REFRESH_MS = 60000;   // alle 60 s

function renderLastUpd(){
  const el = $("#lastUpd"); if(!el) return;
  if(!lastFetch){ el.textContent = ""; return; }
  const sek = Math.round((Date.now() - lastFetch) / 1000);
  let txt;
  if(sek < 10) txt = "gerade aktualisiert";
  else if(sek < 60) txt = `vor ${sek}s aktualisiert`;
  else { const min = Math.round(sek/60); txt = `vor ${min} Min aktualisiert`; }
  el.textContent = txt;
}
setInterval(renderLastUpd, 15000);  // Anzeige laufend auffrischen

function dialogOffen(){ return $("#overlay").classList.contains("open"); }
function queueOffen(){ return queue.length > 0; }

async function autoRefresh(){
  // Nicht neu laden, während gespeichert wird oder der Nutzer ein Ticket bearbeitet
  if(!backendConfigured() || dialogOffen() || queueOffen() || document.hidden) return;
  try {
    await loadFromSheet();   // aktualisiert lastFetch + Cache
    renderDropdowns();
    renderCurrentView();
    renderSync();
  } catch(_){ /* still — Cache/aktueller Stand bleibt */ }
}
setInterval(autoRefresh, AUTO_REFRESH_MS);
// Zusätzlich beim Zurückkommen auf den Tab aktualisieren
document.addEventListener("visibilitychange", () => { if(!document.hidden) autoRefresh(); });

// Zeichnet die aktuell aktive Ansicht (Board oder Aufgabenliste) plus die Fortschrittsbalken.
/* ===================== ABHÄNGIGKEITS-GRAPH ===================== */
let graphState = { nodes: [], edges: [], tx:0, ty:0, scale:1, drag:null, pan:null };

function renderGraph(){
  initGraphInteraction();
  const svg = $("#graphSvg"); if(!svg) return;

  // Alle Tickets (respektiert aktive Board-Filter/Suche)
  const nodesData = tickets.filter(t => t.id && passesFilter(t));
  if(!nodesData.length){
    svg.innerHTML = `<text x="50%" y="80" text-anchor="middle" fill="var(--muted)" font-size="14">Keine Tickets.</text>`;
    return;
  }
  const sichtbar = new Set(nodesData.map(t => t.id));

  // Kanten nur zwischen sichtbaren Tickets
  const edges = [];
  nodesData.forEach(t => {
    blockerListe(t).forEach(b => { if(sichtbar.has(b.id)) edges.push({ from: b.id, to: t.id, offen: b.status !== "Done" }); });
  });

  // Verbunden = hat mindestens eine Kante (als Blocker oder als blockiert)
  const verbunden = new Set();
  edges.forEach(e => { verbunden.add(e.from); verbunden.add(e.to); });

  const byId = {}; nodesData.forEach(t => byId[t.id] = t);
  const tiefe = {};
  function calcTiefe(id, seen){
    if(tiefe[id] != null) return tiefe[id];
    if(seen.has(id)) return 0;
    seen.add(id);
    const blocker = blockerListe(byId[id]).filter(b => sichtbar.has(b.id));
    const d = blocker.length ? 1 + Math.max(...blocker.map(b => calcTiefe(b.id, seen))) : 0;
    seen.delete(id);
    tiefe[id] = d; return d;
  }
  nodesData.forEach(t => calcTiefe(t.id, new Set()));

  const W = 220, H = 84, GAPX = 90, GAPY = 34, ISLAND_GAP = 70;

  // Isolierte Tickets (ohne Kante) in eigenen Spalten ganz links,
  // vom verbundenen Netz durch eine Lücke getrennt.
  const isoliert = nodesData.filter(t => !verbunden.has(t.id));
  const netz     = nodesData.filter(t => verbunden.has(t.id));

  const nodes = [];
  // Isolierte: als kompaktes Raster links (mehrere Spalten, damit es nicht endlos hoch wird)
  const isoProSpalte = Math.max(6, Math.ceil(Math.sqrt(isoliert.length)));
  const isoCols = Math.max(1, Math.ceil(isoliert.length / isoProSpalte));
  isoliert.forEach((t, i) => {
    const col = Math.floor(i / isoProSpalte);
    const row = i % isoProSpalte;
    nodes.push({ id:t.id, t, x: 40 + col*(W+GAPX), y: 66 + row*(H+GAPY), iso:true });
  });
  const netzOffsetX = isoliert.length ? 40 + isoCols*(W+GAPX) + ISLAND_GAP : 40;

  // Verbundenes Netz nach Ebenen rechts daneben
  const proEbene = {};
  netz.forEach(t => { const lvl = tiefe[t.id]||0; proEbene[lvl] = (proEbene[lvl]||0)+1; });
  const belegt = {};
  netz.forEach(t => {
    const lvl = tiefe[t.id] || 0;
    const row = (belegt[lvl] = (belegt[lvl]||0), belegt[lvl]++);
    nodes.push({ id:t.id, t, lvl, row, x: netzOffsetX + lvl*(W+GAPX), y: 66 + row*(H+GAPY), iso:false });
  });
  const maxRows = Math.max(1, ...Object.values(proEbene));
  nodes.forEach(n => { if(!n.iso){ const rows = proEbene[n.lvl]||1; n.y = 66 + (n.row + (maxRows - rows)/2) * (H + GAPY); } });

  graphState.nodes = nodes;
  graphState.edges = edges;
  graphState.byId = {}; nodes.forEach(n => graphState.byId[n.id] = n);
  graphState.dim = { W, H };
  // Bereichs-Infos für Beschriftung/Trennlinie
  graphState.bereiche = {
    hatIso: isoliert.length > 0,
    hatNetz: netz.length > 0,
    isoCount: isoliert.length,
    netzCount: netz.length,
    trennX: isoliert.length ? netzOffsetX - ISLAND_GAP/2 : null,
    netzOffsetX,
    maxY: Math.max(40, ...nodes.map(n => n.y + H))
  };
  drawGraph();
  graphFit();
}

function drawGraph(){
  const svg = $("#graphSvg");
  const { nodes, edges, byId, dim } = graphState;
  const { W, H } = dim;

  const kanten = edges.map(e => {
    const a = byId[e.from], b = byId[e.to];
    if(!a || !b) return "";
    const x1 = a.x + W, y1 = a.y + H/2;
    const x2 = b.x,     y2 = b.y + H/2;
    const mx = (x1 + x2) / 2;
    const cls = e.offen ? "edge open" : "edge done";
    return `<path class="${cls}" d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" marker-end="url(#arrow-${e.offen?'open':'done'})"/>`;
  }).join("");

  const knoten = nodes.map(n => {
    const t = n.t;
    const offen = offeneBlocker(t).length;
    const done = t.status === "Done";
    const cls = "gnode" + (done?" done":"") + (offen?" blocked":"") + (n.iso?" iso":"");
    const ph = phaseName(t.phaseId);
    const ownerStr = (t.owners||[]).map(initialen).join(" ");
    const zeile3 = (offen?`⛔ ${offen} offen`:(done?"✓ erledigt":"")) + (ownerStr?`   ${ownerStr}`:"");
    return `<g class="${cls}" data-id="${esc(t.id)}" transform="translate(${n.x},${n.y})">
      <rect width="${W}" height="${H}" rx="12"/>
      <text class="gn-title" x="12" y="24">${esc(kurz(t.title, 30))}</text>
      <text class="gn-meta" x="12" y="44">${esc(ph)} · ${esc(STATUS_LABEL[t.status]||t.status)}</text>
      <text class="gn-meta" x="12" y="62">${esc(zeile3)}</text>
    </g>`;
  }).join("");

  // Bereichs-Beschriftung + Trennlinie zwischen "frei" und "Abhängigkeiten"
  const b = graphState.bereiche || {};
  let bereichsHtml = "";
  if(b.hatIso){
    bereichsHtml += `<text class="g-area" x="40" y="24">Ohne Abhängigkeit (${b.isoCount})</text>`;
  }
  if(b.hatIso && b.hatNetz && b.trennX != null){
    bereichsHtml += `<line class="g-divider" x1="${b.trennX}" y1="10" x2="${b.trennX}" y2="${b.maxY+20}"/>`;
    bereichsHtml += `<text class="g-area" x="${b.netzOffsetX}" y="24">Abhängigkeiten (${b.netzCount})</text>`;
  }

  svg.innerHTML = `
    <defs>
      <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--overdue)"/>
      </marker>
      <marker id="arrow-done" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gr-done)"/>
      </marker>
    </defs>
    <g id="graphRoot" transform="translate(${graphState.tx},${graphState.ty}) scale(${graphState.scale})">
      ${bereichsHtml}
      ${kanten}
      ${knoten}
    </g>`;

  svg.querySelectorAll(".gnode").forEach(g => {
    g.addEventListener("click", () => { const id = g.dataset.id; if(tickets.some(x=>x.id===id)) openTicket(id); });
  });
}
function kurz(s, n){ s = String(s||""); return s.length > n ? s.slice(0, n-1) + "…" : s; }

function graphFit(){
  const svg = $("#graphSvg"); const { nodes, dim } = graphState;
  if(!nodes.length) return;
  const rect = svg.getBoundingClientRect();
  const minX = Math.min(...nodes.map(n=>n.x)), maxX = Math.max(...nodes.map(n=>n.x + dim.W));
  const minY = Math.min(...nodes.map(n=>n.y)), maxY = Math.max(...nodes.map(n=>n.y + dim.H));
  const gw = maxX - minX + 80, gh = maxY - minY + 80;
  const scale = Math.min(1, Math.min(rect.width / gw, rect.height / gh));
  graphState.scale = scale || 1;
  graphState.tx = (rect.width - gw*graphState.scale)/2 - (minX-40)*graphState.scale;
  graphState.ty = (rect.height - gh*graphState.scale)/2 - (minY-40)*graphState.scale;
  updateGraphTransform();
}
function updateGraphTransform(){
  const root = $("#graphRoot");
  if(root) root.setAttribute("transform", `translate(${graphState.tx},${graphState.ty}) scale(${graphState.scale})`);
}
function initGraphInteraction(){
  const svg = $("#graphSvg"); if(!svg || svg._bound) return; svg._bound = true;
  svg.addEventListener("mousedown", e => {
    if(e.target.closest(".gnode")) return;
    graphState.pan = { x:e.clientX, y:e.clientY, tx:graphState.tx, ty:graphState.ty };
  });
  window.addEventListener("mousemove", e => {
    if(!graphState.pan) return;
    graphState.tx = graphState.pan.tx + (e.clientX - graphState.pan.x);
    graphState.ty = graphState.pan.ty + (e.clientY - graphState.pan.y);
    updateGraphTransform();
  });
  window.addEventListener("mouseup", () => { graphState.pan = null; });
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const faktor = e.deltaY < 0 ? 1.1 : 0.9;
    const neu = Math.min(2.5, Math.max(0.2, graphState.scale * faktor));
    graphState.tx = mx - (mx - graphState.tx) * (neu / graphState.scale);
    graphState.ty = my - (my - graphState.ty) * (neu / graphState.scale);
    graphState.scale = neu;
    updateGraphTransform();
  }, { passive:false });
}

function renderCurrentView(){
  if(viewMode === "tasks") renderTasks();
  else renderGantt();
}

function renderAll(){
  renderDropdowns();
  renderCurrentView();
  renderSync();
  renderLastUpd();
  renderDataWarnung();
}
async function boot(){
  const board = $("#ganttInner");

  // 1) Cache sofort zeigen, falls vorhanden — kein Warten
  const hatCache = backendConfigured() && loadCache();
  if(hatCache){
    renderAll();
    const alter = cacheAge();
    if(alter != null){
      const min = Math.round(alter/60000);
      $("#syncBadge").className = "sync ok";
      $("#syncBadge").textContent = min < 1 ? "Cache · gerade eben" : `Cache · vor ${min} Min`;
    }
    // Deep-Link schon aus dem Cache heraus öffnen (schnelles Erlebnis)
    if(ticketIdFromHash() && tickets.some(t => t.id === ticketIdFromHash())) openTicketFromHash();
  } else if(backendConfigured()){
    board.innerHTML = `<div style="color:var(--muted);font-size:14px;padding:20px 4px;">Lade Gantt …</div>`;
  }

  // 2) Frisch vom Sheet laden und ersetzen
  try {
    await load();
  } catch(e){
    if(hatCache){
      const el = $("#syncBadge"); el.className = "sync err"; el.textContent = "⚠ Offline · Cache";
      el._err = "Konnte nicht aktualisieren: " + (e.message||e); el.title = el._err + " — klicken für Details";
      return;
    }
    board.innerHTML = `<div style="color:var(--overdue);font-size:14px;padding:20px 4px;max-width:520px;">
      Konnte das Sheet nicht laden: ${esc(e.message||String(e))}<br><br>
      Prüfe WEBAPP_URL, die Freigabe der Web-App und ob die Tabs (Owners, Tickets, …) existieren.</div>`;
    return;
  }
  renderAll();
  if(ticketIdFromHash() && !$("#overlay").classList.contains("open")) openTicketFromHash();
  else if(ticketIdFromHash() && editing && editing.id === ticketIdFromHash()){
    const frisch = tickets.find(t => t.id === editing.id);
    if(frisch){ editSnapshot = snapshot(editing.id); editing = JSON.parse(JSON.stringify(frisch)); fillDialog(); }
    else { closeDialog(); zeigeToast("Dieses Ticket existiert nicht mehr."); }
  }
}
boot();
