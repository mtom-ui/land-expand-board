<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land &amp; Expand — Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='9' cy='11' r='6' fill='%2367C3E0'/%3E%3Ccircle cx='14' cy='9' r='6' fill='%2318C7A8' opacity='.85'/%3E%3C/svg%3E">
<style>
  :root {
    --cream: #FFFFFF;              /* Grund hell */
    --ink: #001729;               /* Textfarbe hell-BG */
    --accent: #0865bc;            /* aktiv / Marke */
    --accent-dark: #065196;
    --muted: #4A6079;
    --muted-hell: #8AA0B5;
    --hilfstext: rgba(0,23,41,.30);
    --line: rgba(0,23,41,.14);
    --rahmen: rgba(0,23,41,.20);
    --line-zart: rgba(0,23,41,.07);
    --panel: #E6F0F8;             /* helle Marken-Fläche */
    --feld-radius: 10px;
    --radius: 12px;
    --overdue: #d64828;
    --gr-done: #2FA84F;
    --on-accent: #FFFFFF;
    --weich: cubic-bezier(.2,.8,.25,1);
    --shadow-lg: 0 24px 60px rgba(0,23,41,.16);
    --chip: rgba(0,23,41,.05);
    --phase-w: 400px;
  }
  body.dark {
    color-scheme: dark;
    --cream: #001729;             /* dunkelster Marken-Grund */
    --ink: #FFFFFF;
    --accent: #50DAFF;            /* leuchtendes Cyan = aktiv */
    --accent-dark: #67B5FF;
    --muted: #B7D7F4;
    --muted-hell: #6E8FB0;
    --hilfstext: rgba(183,215,244,.32);
    --line: rgba(183,215,244,.16);
    --rahmen: rgba(183,215,244,.24);
    --line-zart: rgba(183,215,244,.08);
    --panel: #065196;
    --overdue: #FF8A6B;
    --gr-done: #4ADE80;
    --on-accent: #001729;
    --chip: rgba(183,215,244,.08);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--cream);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: 12px; cursor: pointer; }

  /* ===== Kopfzeile ===== */
  header { flex: 0 0 auto; padding: 18px 40px 12px; border-bottom: 1px solid var(--line); background: var(--cream); }
  .head-row { display: flex; align-items: baseline; gap: 20px; }
  .brand { font-size: 21px; font-weight: 400; letter-spacing: -.015em; }
  .brand b { color: var(--accent); font-weight: 400; }
  .head-spacer { flex: 1; }
  .btn { border: 1px solid var(--rahmen); background: none; color: var(--muted); padding: 7px 13px;
         border-radius: var(--feld-radius); transition: border-color .3s var(--weich), color .3s var(--weich); }
  .btn:hover { border-color: var(--muted); color: var(--ink); }
  .btn.primary { color: var(--accent); border-color: var(--accent); }
  .btn.active  { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .sync-wrap { position: relative; display: inline-flex; }
  .sync { font-size: 11px; letter-spacing: .04em; padding: 4px 6px; white-space: nowrap; cursor: pointer;
          border-radius: var(--feld-radius); transition: opacity .4s, background .15s; }
  .sync:hover { background: var(--chip); }
  .last-upd { font-size: 11px; color: var(--muted-hell); white-space: nowrap; }
  .sync.ok   { color: var(--muted-hell); }
  .sync.busy { color: var(--accent); }
  .sync.err  { color: var(--overdue); font-weight: 600; }
  /* "ausgefadet": dezent sichtbar statt unsichtbar, damit weiter anklickbar */
  .sync.fade { opacity: .5; }
  .sync.fade:hover { opacity: 1; }
  /* Speicher-Panel (Verlauf) */
  .save-panel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; width: 300px; max-height: 60vh;
                overflow-y: auto; background: var(--cream); border: 1px solid var(--line); border-radius: 12px;
                box-shadow: 0 12px 40px rgba(0,0,0,.14); padding: 12px; }
  .sp-head { font-size: 9px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-hell);
             margin-bottom: 10px; }
  .sp-list { display: flex; flex-direction: column; gap: 2px; }
  .sp-item { display: flex; align-items: flex-start; gap: 9px; padding: 7px 6px; border-radius: 8px; }
  .sp-item:hover { background: var(--chip); }
  .sp-check { flex: 0 0 auto; color: var(--accent); font-size: 12px; line-height: 1.4; }
  .sp-main { min-width: 0; }
  .sp-label { font-size: 12.5px; color: var(--ink); overflow-wrap: anywhere; }
  .sp-meta { font-size: 10.5px; color: var(--muted-hell); margin-top: 1px; }
  .sp-pending { font-size: 12px; color: var(--accent); padding: 6px 6px 10px; }
  .sp-empty { font-size: 12px; color: var(--muted); padding: 6px; }
  .sp-error { font-size: 12px; color: var(--overdue); background: color-mix(in srgb, var(--overdue) 8%, transparent);
              border-radius: 8px; padding: 9px 10px; margin-bottom: 10px; line-height: 1.45; }
  .sp-error-job { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .data-warn { display: none; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--overdue);
               white-space: nowrap; cursor: pointer; padding: 4px 8px; border: 1px solid var(--overdue);
               border-radius: var(--feld-radius); }
  .data-warn.show { display: inline-block; }
  .data-warn:hover { background: color-mix(in srgb, var(--overdue) 12%, transparent); }

  /* ===== Filterzeile ===== */
  .filter-row { display: flex; align-items: center; gap: 10px; padding: 10px 28px; border-bottom: 1px solid var(--line);
                background: var(--cream); flex-wrap: wrap; }
  .filter-row .search { max-width: 260px; }
  .gantt-controls { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; }
  .gantt-controls.hidden { display: none; }

  /* ===== Fortschrittsbalken oben ===== */
  .progress-row { display: flex; gap: 48px; padding: 16px 40px 18px; border-bottom: 1px solid var(--line); background: var(--cream); }
  .prog { flex: 1 1 0; min-width: 0; }
  .prog-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .prog-label { font-size: 9.5px; font-weight: 400; letter-spacing: .15em; text-transform: uppercase; color: var(--muted-hell); }
  .prog-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prog-track { position: relative; height: 7px; border-radius: 20px; background: var(--chip); overflow: hidden; }
  /* Balken 1: Zeit — Phasenabschnitte (nur Farbe, keine harten Striche) + Heute-Marker */
  .prog-phases { position: absolute; inset: 0; }
  .prog-phase-seg { position: absolute; top: 0; bottom: 0; box-sizing: border-box; }
  #progTimeTrack { overflow: visible; }
  .prog-today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent);
                transform: translateX(-1px); transition: left .4s var(--weich); z-index: 2; }
  .prog-today-dot { position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
                    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
                    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  /* Phasennamen unter dem Zeitbalken */
  .prog-phase-labels { position: relative; height: 14px; margin-top: 6px; }
  .prog-phase-lbl { position: absolute; top: 0; font-size: 10px; color: var(--muted-hell); white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; transform: translateX(-50%);
                    padding: 0 3px; }
  .prog-phase-lbl.active { color: var(--accent); font-weight: 600; }
  /* Balken 2: erledigte Tickets — einfacher Füllbalken */
  .prog-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 20px; background: var(--accent);
               transition: width .4s var(--weich); }
  .prog-ends { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--muted-hell);
               font-variant-numeric: tabular-nums; }
  @media (max-width: 760px){ .progress-row { flex-direction: column; gap: 18px; } }
  .filter-label { font-size: 9.5px; font-weight: 400; letter-spacing: .15em; text-transform: uppercase; color: var(--muted-hell); }
  .search { flex: 0 0 260px; padding: 8px 12px; border: 1px solid var(--rahmen); border-radius: var(--feld-radius);
            font-family: inherit; font-size: 13px; color: var(--ink); background: none; transition: border-color .3s var(--weich); }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--hilfstext); }

  /* Dropdown-Filter (Owner, Status) */
  .dd { position: relative; }
  .dd-trigger { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 400;
                letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; border-radius: var(--feld-radius);
                border: 1px solid var(--rahmen); color: var(--muted); background: none;
                transition: color .3s var(--weich), border-color .3s var(--weich); }
  .dd-trigger:hover { color: var(--ink); border-color: var(--muted); }
  .dd-trigger.has { color: var(--accent); border-color: var(--accent); }
  .dd-trigger .caret { font-size: 8px; opacity: .7; }
  .dd-trigger .cnt { color: var(--accent); font-variant-numeric: tabular-nums; }
  .dd-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; display: none; flex-direction: column;
              gap: 2px; min-width: 180px; padding: 8px; background: var(--cream); border: 1px solid var(--line);
              border-radius: var(--feld-radius); box-shadow: var(--shadow-lg); }
  .dd-panel.open { display: flex; }
  .dd-opt { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 7px; cursor: pointer;
            font-size: 13px; color: var(--ink); user-select: none; }
  .dd-opt:hover { background: var(--chip); }
  .dd-opt .box { width: 14px; height: 14px; flex: 0 0 auto; border: 1.5px solid var(--muted); border-radius: 4px;
                 display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  .dd-opt.sel .box { background: var(--accent); border-color: var(--accent); }
  .dd-opt.sel .box::after { content: "✓"; color: var(--on-accent); font-size: 10px; }
  .dd-clear { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-hell);
              background: none; border: none; border-top: 1px solid var(--line); margin-top: 4px; padding: 8px 9px 4px;
              text-align: left; }
  .dd-clear:hover { color: var(--accent); }

  /* ===== Board-Fläche: waagerecht durch Phasen scrollen ===== */
  .board-scroll { flex: 1 1 auto; overflow-x: auto; overflow-y: hidden; padding: 14px 28px 28px; }
  .board { display: flex; gap: 0; height: 100%; align-items: stretch; min-height: 0; }

  /* ===== Aufgaben-Ansicht (Liste offener Tasks/Subtasks je Owner) ===== */
  /* ===== Gantt ===== */
  .gantt-view { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .gantt-view[hidden] { display: none; }
  .gantt-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 28px; border-bottom: 1px solid var(--line); }
  .gantt-unit { display: inline-flex; border: 1px solid var(--rahmen); border-radius: var(--feld-radius); overflow: hidden; }
  .gantt-unit .seg { border: none; background: none; padding: 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .gantt-unit .seg.active { background: var(--accent); color: var(--on-accent); }
  .gantt-hint { font-size: 11px; color: var(--muted-hell); margin-left: auto; }
  .gantt-group { display: inline-flex; align-items: center; gap: 8px; }
  .gantt-group .gg-label { font-size: 11px; color: var(--muted-hell); }
  .gantt-group .seg { border: 1px solid var(--rahmen); background: none; padding: 5px 11px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .gantt-group .seg:first-of-type { border-radius: var(--feld-radius) 0 0 var(--feld-radius); border-right: none; }
  .gantt-group .seg:last-of-type { border-radius: 0 var(--feld-radius) var(--feld-radius) 0; }
  .gantt-group .seg.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  /* Gruppen-Kopfzeile im Gantt */
  .g-grouprow { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .g-grouplabel { position: sticky; left: 0; display: flex; align-items: center; gap: 8px; height: 100%;
                  padding: 0 12px 0 14px; box-sizing: border-box; z-index: 2;
                  background: color-mix(in srgb, var(--accent) 7%, var(--cream));
                  border-right: 1px solid var(--line); border-top: 1px solid var(--line);
                  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .g-grouplabel .gl-count { font-size: 10px; font-weight: 400; color: var(--muted-hell); }
  .g-grouplabel .gl-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .g-grouplabel .gl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-grouplabel .gl-prog { margin-left: auto; flex: 0 0 auto; width: 46px; height: 5px; border-radius: 20px;
                           background: color-mix(in srgb, var(--muted-hell) 22%, transparent); overflow: hidden; }
  .g-grouplabel .gl-prog-fill { display: block; height: 100%; border-radius: 20px; background: var(--gr-done); }
  .gantt-nodate { flex: 0 0 auto; padding: 10px 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--overdue) 4%, transparent); }
  /* Gesamtfortschritt oben */
  .gantt-progress { flex: 0 0 auto; padding: 12px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; }
  .gp-bar-wrap { flex: 1 1 auto; height: 10px; border-radius: 20px; background: var(--chip); overflow: hidden; position: relative; max-width: 520px; }
  .gp-bar-fill { height: 100%; border-radius: 20px; background: var(--gr-done); transition: width .4s var(--weich); }
  .gp-text { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .gp-text b { color: var(--ink); font-weight: 600; }
  .gp-stats { font-size: 11px; color: var(--muted-hell); white-space: nowrap; display: inline-flex; gap: 12px; }
  .gp-stats .st-over { color: var(--overdue); }
  .gantt-nodate .nd-head { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .gantt-nodate .nd-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .nd-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink);
             border: 1px solid var(--rahmen); border-radius: 20px; padding: 5px 12px; background: var(--panel); cursor: pointer;
             transition: border-color .15s; }
  .nd-chip:hover { border-color: var(--accent); }
  .nd-prio { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .gantt-scroll { flex: 1 1 auto; overflow: auto; position: relative; }
  .gantt-inner { position: relative; min-width: 100%; }
  /* Zeitachse — sticky-Kopf, bleibt beim vertikalen Scrollen oben */
  .g-axis { position: sticky; top: 0; left: 0; height: 40px; z-index: 6; background: var(--cream);
            border-bottom: 1px solid var(--line); }
  .g-gridlayer { position: absolute; top: 0; left: 0; z-index: 0; }
  .g-corner { position: sticky; position: -webkit-sticky; left: 0; top: 0; height: 40px;
              background: var(--cream); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
              z-index: 8; display: block; margin-top: -40px; }
  .g-tick { position: absolute; top: 0; height: 40px; padding: 6px 0 0 5px; font-size: 10px; font-weight: 600; letter-spacing: .04em;
            color: var(--muted); white-space: nowrap; z-index: 2; }
  .g-tick.we { color: var(--muted-hell); }
  .g-tick-sub { display: block; font-size: 9px; font-weight: 400; color: var(--muted-hell); margin-top: 1px; }
  .g-grid { position: absolute; top: 40px; width: 1px; background: var(--line-zart); z-index: 0; }
  .g-grid.we { background: color-mix(in srgb, var(--muted-hell) 12%, transparent); }
  .g-today { position: absolute; top: 0; width: 2px; background: var(--accent); z-index: 1; opacity: .7; }
  /* Zeilen + Balken */
  .g-row { position: absolute; left: 0; right: 0; }
  .g-row:nth-child(even) { background: color-mix(in srgb, var(--muted-hell) 3%, transparent); }
  .g-rowlabel { position: sticky; left: 0; display: flex; align-items: center; gap: 7px; height: 100%; padding: 0 12px 0 14px;
                background: var(--cream); border-right: 1px solid var(--line); cursor: pointer; z-index: 2; box-sizing: border-box; }
  .g-rowlabel:hover .g-rowtitle { color: var(--accent); }
  .g-prio { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .g-rowtitle { font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-bar { position: absolute; height: 26px; border-radius: 7px; z-index: 2; cursor: grab; display: flex; align-items: center; gap: 6px;
           padding: 0 8px; box-sizing: border-box; background: var(--panel);
           border: 1px solid var(--rahmen); overflow: hidden; transition: box-shadow .15s, border-color .15s; }
  .g-bar:hover { box-shadow: 0 3px 12px rgba(0,23,41,.16); border-color: var(--accent); z-index: 5; }
  .g-bar:active { cursor: grabbing; }
  .g-bar.done { opacity: .6; }
  .g-bar.blocked { border-color: var(--overdue); }
  .g-bar.overdue { border-color: var(--overdue); background: color-mix(in srgb, var(--overdue) 8%, var(--panel)); }
  /* Verbindungslinien: dezent per Default, beim Zeilen-Hover leuchten die eigenen auf */
  /* Linien im Ruhezustand dezent ausgegraut; leuchten nur beim Hover über ihr Ticket auf */
  .g-link { opacity: .1; transition: opacity .15s, stroke-width .15s; }
  .g-links.hover-active .g-link { opacity: .07; }
  .g-links.hover-active .g-link.hot { opacity: 1; stroke-width: 2.4; }
  /* Ausgegraute (bei Suche mitgezogene) Blocker */
  .g-row.dimmed .g-rowlabel { opacity: .5; }
  .g-bar.dimmed, .g-milestone.dimmed { opacity: .4; filter: grayscale(.4); }
  .g-bar.dimmed:hover, .g-milestone.dimmed:hover { opacity: .85; filter: none; }
  .g-bar-prio { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; position: relative; z-index: 1; }
  .g-bar-label { font-size: 11.5px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; position: relative; z-index: 1; }
  .g-bar-owners { font-size: 9px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; position: relative; z-index: 1; }
  /* Meilenstein (Start == Ende) als Raute */
  .g-milestone { position: absolute; height: 26px; display: flex; align-items: center; gap: 8px; cursor: grab; z-index: 2; }
  .g-milestone:active { cursor: grabbing; }
  .ms-diamond { width: 15px; height: 15px; transform: rotate(45deg); border-radius: 3px; flex: 0 0 auto;
                box-shadow: 0 1px 4px rgba(0,23,41,.2); transition: box-shadow .15s; }
  .g-milestone:hover .ms-diamond { box-shadow: 0 2px 8px rgba(0,23,41,.35); }
  .g-milestone.done .ms-diamond { opacity: .5; }
  .g-milestone.overdue .ms-diamond { outline: 2px solid var(--overdue); outline-offset: 1px; }
  .ms-label { font-size: 11.5px; color: var(--ink); white-space: nowrap; pointer-events: none; }
  .g-handle { position: absolute; top: 0; width: 8px; height: 100%; cursor: ew-resize; z-index: 3; }
  .g-handle.l { left: 0; } .g-handle.r { right: 0; }
  .g-bar.schmal { overflow: visible; }
  .g-bar-outside { position: absolute; left: calc(100% + 7px); top: 50%; transform: translateY(-50%);
                   font-size: 11.5px; color: var(--ink); white-space: nowrap; pointer-events: none; }
  /* Ziel-Popover beim Hover über die Zeile */
  .g-goal-pop { position: absolute; z-index: 20; max-width: 360px; min-width: 200px; padding: 12px 14px; border-radius: 10px;
                background: var(--cream); border: 1px solid var(--line); box-shadow: var(--shadow-lg);
                font-size: 12px; color: var(--muted); line-height: 1.5; pointer-events: none;
                opacity: 0; transform: translateY(3px); transition: opacity .15s, transform .15s; }
  .g-goal-pop.show { opacity: 1; transform: translateY(0); }
  .g-goal-pop .gp-head { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 5px; }
  .g-goal-pop .gp-meta { font-size: 10.5px; color: var(--muted-hell); margin-bottom: 4px; }
  .g-goal-pop .gp-block { font-size: 11px; color: var(--overdue); margin-bottom: 4px; }
  .g-goal-pop .gp-title { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 8px 0 4px; font-weight: 700; }
  .g-goal-pop .gp-goal { font-size: 12px; color: var(--muted); }
  .g-goal-pop .gp-deps { margin: 7px 0 2px; display: flex; flex-direction: column; gap: 5px; }
  .g-goal-pop .gp-dep { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .g-goal-pop .gp-dep-lbl { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .g-goal-pop .gp-dep-lbl.wait { color: var(--overdue); }
  .g-goal-pop .gp-dep-lbl.block { color: var(--accent); }
  .g-goal-pop .gp-dep-item { font-size: 11px; color: var(--ink); background: var(--chip); border-radius: 12px; padding: 2px 8px; }
  .g-goal-pop .gp-dep-item.done { color: var(--muted-hell); text-decoration: line-through; }

  /* ===== Aufgaben-Ansicht ===== */
  .tasks-view { flex: 1 1 auto; overflow-y: auto; padding: 22px 40px 60px; max-width: 900px; width: 100%; margin: 0 auto; }
  .task-info { font-size: 11.5px; color: var(--muted-hell); margin-bottom: 12px; }
  /* ===== Abhängigkeits-Graph ===== */
  .graph-view { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* Das hidden-Attribut muss display:flex überstimmen, sonst bleibt der Graph
     unter dem Board sichtbar (Klassen-Regel ist spezifischer als [hidden]). */
  .graph-view[hidden] { display: none; }
  .graph-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 18px; padding: 10px 40px;
                   border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .graph-legend { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
  .lg-arrow { width: 22px; height: 0; border-top: 2px solid; position: relative; }
  .lg-arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 4px solid transparent; }
  .lg-arrow.open { border-color: var(--overdue); }
  .lg-arrow.open::after { border-left-color: var(--overdue); }
  .lg-arrow.done { border-color: var(--gr-done); }
  .lg-arrow.done::after { border-left-color: var(--gr-done); }
  .graph-hint { font-size: 11px; color: var(--muted-hell); margin-right: auto; }
  .graph-svg { flex: 1 1 auto; width: 100%; min-height: 0; cursor: grab; background:
               radial-gradient(circle, var(--line-zart) 1px, transparent 1px); background-size: 26px 26px; }
  .graph-svg:active { cursor: grabbing; }
  .graph-svg .edge { fill: none; stroke-width: 2; }
  .graph-svg .edge.open { stroke: var(--overdue); }
  .graph-svg .edge.done { stroke: var(--gr-done); stroke-dasharray: 5 4; opacity: .8; }
  .graph-svg .gnode { cursor: pointer; }
  .graph-svg .gnode rect { fill: var(--panel); stroke: var(--rahmen); stroke-width: 1;
                           transition: stroke .15s, filter .15s; }
  .graph-svg .gnode:hover rect { stroke: var(--accent); filter: drop-shadow(0 3px 10px rgba(0,23,41,.14)); }
  .graph-svg .gnode.blocked rect { stroke: var(--overdue); stroke-width: 1.5; }
  .graph-svg .gnode.done rect { opacity: .6; }
  .graph-svg .gn-title { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .graph-svg .gn-meta { fill: var(--muted); font-size: 10.5px; }
  .graph-svg .gnode.iso rect { stroke-dasharray: 4 3; opacity: .92; }
  .graph-svg .g-area { fill: var(--muted-hell); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .graph-svg .g-divider { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 5; }
  .task-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .task-chip { font-size: 12px; letter-spacing: .02em; color: var(--muted); background: var(--chip);
               border: 1px solid transparent; border-radius: 20px; padding: 6px 13px; cursor: pointer;
               transition: color .2s, border-color .2s, background .2s; }
  .task-chip:hover { color: var(--ink); }
  .task-chip.sel { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .task-chip .tc-num { font-size: 10px; color: var(--muted-hell); margin-left: 3px; }
  .task-chip.sel .tc-num { color: var(--accent); }

  .task-group { margin-bottom: 30px; }
  .task-group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
                     padding-bottom: 7px; border-bottom: 1px solid var(--line); }
  .tg-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
  .tg-count { font-size: 11px; color: var(--muted-hell); letter-spacing: .04em; }

  .task-list { display: flex; flex-direction: column; gap: 2px; }
  .task-row { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px;
              cursor: pointer; transition: background .12s; }
  .task-row:hover { background: var(--chip); }
  .task-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; }
  .task-dot.open { background: var(--accent); }
  .task-dot.blk { background: var(--overdue); }
  .task-check { flex: 0 0 auto; width: 18px; height: 18px; display: inline-flex; align-items: center;
                justify-content: center; border-radius: 50%; color: var(--muted); font-size: 15px;
                border: 1px solid transparent; transition: color .12s, border-color .12s; }
  .task-check:hover { color: var(--accent); border-color: var(--accent); }
  .task-main { flex: 1 1 auto; min-width: 0; }
  .task-title { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
  .task-row.subtask .task-title { color: var(--muted); }
  .task-sub { font-size: 11px; color: var(--muted-hell); letter-spacing: .01em; margin-top: 2px; overflow-wrap: anywhere; }
  .task-kind { flex: 0 0 auto; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
               color: var(--muted-hell); padding: 3px 8px; border-radius: 5px; background: var(--chip); }
  .task-kind.sub { background: none; border: 1px solid var(--line); }
  .task-row.blocked .task-title { color: var(--ink); }
  .task-empty { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
  .phase { flex: 0 0 var(--phase-w); display: flex; flex-direction: column; min-height: 0; border-radius: 12px;
           padding: 0 20px; position: relative; transition: background .3s var(--weich); }
  /* Trennlinie zwischen den Phasen (feine vertikale Linie im Zwischenraum) */
  .phase::after { content: ""; position: absolute; top: 40px; bottom: 20px; right: 0; width: 1px;
                  background: var(--line); }
  .phase:last-child::after { display: none; }
  /* Aktive Phase: ganze Spalte dezent hinterlegt + Kopf hervorgehoben */
  .phase.aktiv { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .phase-head { flex: 0 0 auto; padding: 4px 0 9px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .phase.aktiv .phase-head { border-bottom-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .phase-head.has-desc { cursor: default; }
  .phase-name { font-size: 14px; font-weight: 400; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  .phase.aktiv .phase-name { color: var(--accent); font-weight: 600; }
  /* "AKTUELL"-Marker */
  .phase-now { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
               color: var(--on-accent); background: var(--accent); padding: 2px 7px; border-radius: 20px; margin-left: 4px; }
  .phase-head.has-desc .phase-name .phase-caret { font-size: 8px; color: var(--muted-hell);
                                            transition: color .15s, transform .2s var(--weich); }
  .phase-head.has-desc:hover .phase-name .phase-caret { color: var(--accent); transform: rotate(180deg); }
  .phase-dates { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-hell);
                 margin-top: 5px; font-variant-numeric: tabular-nums; }
  .phase.aktiv .phase-dates { color: var(--accent); }
  /* Beschreibung klappt beim Hover über den Phasenkopf auf — wie das Ziel bei den Karten */
  .phase-desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere;
                max-height: 0; overflow: hidden; opacity: 0; margin-top: 0;
                transition: max-height .25s var(--weich), opacity .2s var(--weich), margin-top .25s var(--weich); }
  .phase-head.has-desc:hover .phase-desc { max-height: 160px; opacity: 1; margin-top: 8px; }
  .phase-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0; padding-right: 2px; min-height: 0; }
  /* Vertikaler Fluss-Pfeil zwischen den Status-Reihen */
  .lane-flow { display: flex; justify-content: center; align-items: center; height: 12px; margin: 1px 0;
               color: var(--muted-hell); font-size: 11px; user-select: none; }
  .lane-flow span { line-height: 1; opacity: .5; }
  .lane.collapsed + .lane-flow { opacity: .35; }

  /* Status-Reihen innerhalb einer Phase — feste Höhe, intern scrollbar */
  .lane { display: flex; flex-direction: column; gap: 6px; margin: 3px 0; }
  .lane-label { font-size: 9px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-hell);
                display: flex; align-items: baseline; gap: 7px; cursor: pointer; user-select: none;
                transition: color .2s var(--weich); }
  .lane-label:hover { color: var(--muted); }
  .lane-label .arw { font-size: 8px; transition: transform .2s var(--weich); align-self: center; }
  .lane.collapsed .arw { transform: rotate(-90deg); }
  .lane-label .cnt { font-variant-numeric: tabular-nums; }
  .lane.collapsed .lane-drop { display: none; }
  .lane-drop { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start;
               height: var(--lane-h, 190px); overflow-y: auto; padding: 2px;
               border: 1px dashed transparent; border-radius: var(--radius);
               transition: border-color .12s, background .12s; }
  /* Erledigt-Reihe kompakter (ist meist eingeklappt; ausgeklappt niedriger als die aktiven) */
  .lane-done .lane-drop { height: var(--lane-done-h, 120px); }
  .lane-drop.dragover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .lane-empty { grid-column: 1 / -1; align-self: start; font-size: 10.5px; color: var(--hilfstext); padding: 3px 2px; }
  .lane-drop::-webkit-scrollbar { width: 5px; }
  .lane-drop::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted-hell) 35%, transparent); border-radius: 20px; }
  .lane-drop::-webkit-scrollbar-thumb:hover { background: var(--muted-hell); }
  .lane-drop::-webkit-scrollbar-track { background: transparent; }
  .lane-drop { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted-hell) 35%, transparent) transparent; }

  /* ===== Ticket-Karte ===== */
  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--panel);
          cursor: pointer; transition: border-color .2s var(--weich), box-shadow .2s var(--weich); }
  .card:hover { border-color: var(--accent); box-shadow: 0 3px 14px rgba(0,23,41,.08); }
  .card.blocked { border-left: 3px solid var(--overdue); }
  .card.done { opacity: .55; }
  /* Kopf: Titel + Tag-Punkte in einer Zeile */
  .card-top { display: flex; align-items: flex-start; gap: 7px; }
  .card-title { flex: 1 1 auto; font-weight: 400; font-size: 12.5px; line-height: 1.3; letter-spacing: -.01em;
                overflow-wrap: anywhere; }
  .card.done .card-title { text-decoration: line-through; text-decoration-color: var(--muted-hell); }
  /* Ziel-Vorschau: klappt beim Hover dezent auf */
  .card-goal { font-size: 11px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere;
               max-height: 0; overflow: hidden; opacity: 0; margin-top: 0;
               transition: max-height .25s var(--weich), opacity .2s var(--weich), margin-top .25s var(--weich); }
  .card:hover .card-goal { max-height: 60px; opacity: 1; margin-top: 6px;
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  /* Aktivitäts-Punkt: erstellt/geändert in den letzten 8h */
  .fresh-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
               margin-right: 5px; vertical-align: middle; position: relative; top: -1px; flex: 0 0 auto; }
  /* Tags nur als farbige Punkte */
  .tag-dots { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px; padding-top: 3px; max-width: 46%; justify-content: flex-end; }
  .tag-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  /* Footer: Owner-Avatare links, Meta rechts */
  .card-foot { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .avatars { display: flex; flex-wrap: wrap; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px;
            border-radius: 50%; font-size: 8px; font-weight: 600; letter-spacing: .02em;
            color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); margin-right: -4px; }
  .avatar:last-child { margin-right: 0; }
  .foot-right { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
  .card-meta { display: inline-flex; align-items: center; gap: 7px; font-size: 9.5px; letter-spacing: .04em;
               color: var(--muted-hell); }
  .card-meta .ic { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .blk-dot { font-size: 10px; cursor: pointer; line-height: 1; display: inline-flex; align-items: center; gap: 1px; }
  .blk-dot:hover { transform: scale(1.15); }
  .blk-dot .blk-cnt { font-size: 8.5px; font-weight: 700; color: var(--overdue); }

  /* ===== Overlay / Dialog ===== */
  .overlay { position: fixed; inset: 0; background: rgba(32,48,58,.28); display: none; align-items: flex-start;
             justify-content: center; z-index: 50; padding: 28px 20px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .overlay.open > .modal { margin: auto; }
  .modal { background: var(--cream); border: 1px solid var(--line); border-radius: 18px;
           width: 75vw; max-width: none;
           min-width: min(760px, calc(100vw - 56px));
           min-height: min(75vh, calc(100vh - 96px)); max-height: calc(100vh - 96px);
           box-shadow: var(--shadow-lg); padding: 26px 30px;
           display: flex; flex-direction: column; }
  @media (max-width: 1000px){
    .modal { width: 100%; max-width: 600px; min-width: 0; min-height: 0; max-height: calc(100vh - 48px); }
  }

  .tk-kopf { display: flex; align-items: center; gap: 20px; padding-bottom: 14px; margin-bottom: 14px;
             border-bottom: 1px solid var(--line); }
  .tk-titel { flex: 1 1 auto; min-width: 0; border: none; background: none; padding: 0;
              font-family: inherit; font-size: 22px; font-weight: 400; letter-spacing: -.015em; color: var(--ink); }
  .tk-titel::placeholder { color: var(--hilfstext); }
  .tk-titel:focus { outline: none; }

  /* Status als Slide-Toggle */
  .stage-path { display: flex; margin: 0; flex: 0 0 auto; }
  .status-toggle { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
                   padding: 3px; border-radius: 22px; background: var(--chip); border: 1px solid var(--rahmen); }
  .st-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; z-index: 0; border-radius: 20px;
               width: calc((100% - 6px) / var(--n)); background: var(--accent);
               transform: translateX(calc(var(--idx) * 100%));
               transition: transform .25s var(--weich), background .25s var(--weich); }
  .st-slider.done { background: var(--gr-done); }
  .st-seg { position: relative; z-index: 1; padding: 6px 18px; border: none; background: none; cursor: pointer;
            font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
            color: var(--muted); outline: none; transition: color .2s var(--weich); }
  .st-seg.aktiv { color: var(--on-accent); }
  @media (max-width: 1000px){
    .tk-kopf { flex-direction: column; align-items: stretch; gap: 12px; }
    .status-toggle { width: 100%; }
  }

  .modal-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 28px; overflow: hidden; }
  .mcol { min-width: 0; overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; }
  @media (max-width: 1000px){
    .modal-body { grid-template-columns: 1fr; gap: 0; overflow: visible; }
    .mcol { overflow: visible; }
    #mcolMid, #mcolRight { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
  }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 9px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
                 color: var(--muted-hell); margin-bottom: 7px; }
  .field input[type=text], .field textarea, .field select {
    width: 100%; padding: 8px 11px; border: 1px solid var(--rahmen); border-radius: var(--feld-radius);
    font-family: inherit; font-size: 14.5px; background: none; color: var(--ink); transition: border-color .3s var(--weich); }
  .field input:hover, .field textarea:hover, .field select:hover { border-color: var(--muted); }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 120px; line-height: 1.6; }

  /* ===== Rich-Text-Editor (Beschreibung + Updates) ===== */
  .rte-wrap { border: 1px solid var(--rahmen); border-radius: var(--feld-radius); overflow: hidden;
              transition: border-color .3s var(--weich); }
  .rte-wrap:hover { border-color: var(--muted); }
  .rte-wrap:focus-within { border-color: var(--accent); }
  /* Toolbar ist im Ruhezustand ausgeblendet und fährt erst bei Fokus auf */
  .rte-bar { display: flex; gap: 2px; padding: 0 6px; max-height: 0; overflow: hidden; opacity: 0;
             border-bottom: 1px solid transparent; flex-wrap: wrap;
             transition: max-height .2s var(--weich), opacity .18s var(--weich), padding .2s var(--weich), border-color .2s var(--weich); }
  .rte-wrap:focus-within .rte-bar { max-height: 44px; opacity: 1; padding: 5px 6px; border-bottom-color: var(--line); }
  .rte-bar button { border: none; background: none; color: var(--muted); width: 30px; height: 28px; border-radius: 6px;
                    font-size: 13px; display: inline-flex; align-items: center; justify-content: center;
                    transition: background .15s, color .15s; }
  .rte-bar button:hover { background: var(--chip); color: var(--ink); }
  .rte-bar button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .rte-bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 3px; }
  .rte { min-height: 96px; padding: 10px 12px; font-size: 14px; line-height: 1.65; color: var(--ink);
         outline: none; overflow-wrap: anywhere; }
  .rte.sm { min-height: 60px; font-size: 13.5px; }
  .rte.is-empty:before { content: attr(data-placeholder); color: var(--hilfstext); pointer-events: none; }
  .rte ul { list-style: disc outside; margin: 4px 0; padding-left: 22px; }
  .rte ol { list-style: decimal outside; margin: 4px 0; padding-left: 24px; }
  .rte li { margin: 1px 0; }
  .rte ul ul { list-style: circle; }
  .rte ol ol { list-style: lower-roman; }
  .rte blockquote { margin: 8px 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--accent); color: var(--muted); }
  .rte a, .md a, .card-goal a, .upd-text a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .rte a:hover, .md a:hover, .card-goal a:hover, .upd-text a:hover { text-decoration: none; }
  .rte div { min-height: 1.2em; }
  .rte strong { font-weight: 700; }

  /* Gerenderte Markdown-Vorschau (Karten, Updates-Liste) */
  .md ul { list-style: disc outside; margin: 3px 0; padding-left: 20px; }
  .md ol { list-style: decimal outside; margin: 3px 0; padding-left: 22px; }
  .md li { margin: 1px 0; }
  .md blockquote { margin: 5px 0; padding: 1px 0 1px 11px; border-left: 2px solid var(--accent); color: var(--muted); }
  .md strong { font-weight: 700; }
  .md p, .md div { margin: 0; }
  /* Ziel- und Beschreibungsspalte: das RTE-Feld füllt die Spaltenhöhe */
  #mcolGoal .field, #mcolDesc .field { flex: 1 1 auto; display: flex; flex-direction: column; }
  #mcolGoal .rte-wrap, #mcolDesc .rte-wrap { flex: 1 1 auto; display: flex; flex-direction: column; }
  #mcolGoal .rte, #mcolDesc .rte { flex: 1 1 auto; }
  /* Ziel = "Vorgabe": dezent getöntes Panel, hebt sich als etwas Gesetztes ab */
  #mcolGoal .rte-wrap { background: color-mix(in srgb, var(--accent) 5%, transparent);
                        border-color: color-mix(in srgb, var(--accent) 28%, var(--rahmen)); }
  .collapse-label { display: flex; align-items: center; gap: 8px; user-select: none; margin-bottom: 8px; }
  .collapse-label label { margin: 0; }
  .goal-pin { font-size: 12px; line-height: 1; }
  .goal-tag { font-size: 8.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
              color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
              border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
              padding: 2px 7px; border-radius: 20px; }
  .goal-collapse { margin-left: auto; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
                   font-size: 15px; color: var(--muted); background: none; border: 1px solid var(--rahmen);
                   border-radius: var(--feld-radius); cursor: pointer; transition: color .2s var(--weich), border-color .2s var(--weich); }
  .goal-collapse:hover { color: var(--accent); border-color: var(--accent); }
  /* Eingeklappt: Ziel-Spalte raus, deutlicher Wiederöffner am Rand */
  .modal-body.goal-zu { grid-template-columns: 0 1fr 1fr; }
  .modal-body.goal-zu #mcolGoal { display: none; }
  .goal-reopen { display: none; flex: 0 0 auto; align-self: stretch; align-items: center; gap: 8px;
                 writing-mode: vertical-rl; padding: 14px 10px; margin-right: 4px; cursor: pointer;
                 border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--rahmen)); border-radius: var(--feld-radius);
                 background: color-mix(in srgb, var(--accent) 6%, transparent); color: var(--accent);
                 font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; user-select: none;
                 transition: background .2s var(--weich), border-color .2s var(--weich); }
  .goal-reopen:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: var(--accent); }
  .modal-body.goal-zu .goal-reopen { display: flex; }

  /* Multipicklist Owner */
  .pick-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick-opt { font-size: 10px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase;
              padding: 6px 11px; border-radius: var(--feld-radius); border: 1px solid var(--rahmen);
              cursor: pointer; user-select: none; color: var(--muted); background: none;
              transition: color .3s var(--weich), border-color .3s var(--weich); }
  .pick-opt:hover { color: var(--ink); border-color: var(--muted); }
  .pick-opt.sel { color: var(--accent); border-color: var(--accent); }

  /* ===== Kompakte Meta-Zeile mit Dropdown-Feldern ===== */
  .meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 16px; margin-bottom: 20px; }
  .meta-grid.meta-top { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px 20px; margin-bottom: 20px; }
  @media (max-width: 900px){ .meta-grid.meta-top { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 620px){ .meta-grid.meta-top { grid-template-columns: 1fr; } }
  .meta-top .mfield > label { font-size: 8.5px; margin-bottom: 4px; }
  .meta-top .msel-trigger { min-height: 32px; padding: 5px 9px; }
  .mdate { width: 100%; min-height: 32px; padding: 5px 9px; box-sizing: border-box; font-family: inherit; font-size: 13px;
           color: var(--ink); background: var(--panel); border: 1px solid var(--rahmen); border-radius: var(--feld-radius); }
  .mdate:focus { outline: none; border-color: var(--accent); }
  .mfield { min-width: 0; }
  .mfield > label { display: block; font-size: 9px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
                    color: var(--muted-hell); margin-bottom: 3px; }
  .msel { position: relative; }
  .msel-trigger { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 4px;
                  border: 1px solid transparent; border-bottom: 1px solid var(--line); border-radius: 0; background: none;
                  cursor: pointer; text-align: left; transition: border-color .2s var(--weich), background .2s var(--weich); }
  .msel-trigger:hover { border-bottom-color: var(--muted); }
  .msel.open .msel-trigger { border: 1px solid var(--accent); border-radius: var(--feld-radius); background: var(--cream); }
  .msel-vals { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
  .msel-ph { color: var(--hilfstext); font-size: 13px; }
  .msel-caret { flex: 0 0 auto; font-size: 8px; color: var(--muted-hell); }
  .msel-chip { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px;
               border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .msel-chip.tag { border: 1px solid; }
  .msel-panel { position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 46; display: none; flex-direction: column;
                gap: 2px; max-height: 240px; overflow-y: auto; padding: 7px; background: var(--cream);
                border: 1px solid var(--line); border-radius: var(--feld-radius); box-shadow: var(--shadow-lg); }
  .msel.open .msel-panel { display: flex; }
  .msel-opt { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 7px; cursor: pointer;
              font-size: 13px; color: var(--ink); user-select: none; }
  .msel-opt:hover { background: var(--chip); }
  .msel-opt .box { width: 14px; height: 14px; flex: 0 0 auto; border: 1.5px solid var(--muted); border-radius: 4px;
                   display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  .msel-opt.round .box { border-radius: 50%; }
  .msel-opt.sel .box { background: var(--accent); border-color: var(--accent); }
  .msel-opt.sel .box::after { content: "✓"; color: var(--on-accent); font-size: 10px; }
  .msel.invalid .msel-trigger { border-color: var(--overdue); }
  /* Suchfeld innerhalb eines msel-Panels */
  .msel-search-box { padding: 2px 2px 6px; position: sticky; top: 0; background: var(--cream); }
  .msel-search { width: 100%; padding: 7px 10px; border: 1px solid var(--rahmen); border-radius: var(--feld-radius);
                 font-family: inherit; font-size: 13px; color: var(--ink); background: none;
                 transition: border-color .2s var(--weich); }
  .msel-search:focus { outline: none; border-color: var(--accent); }
  .msel-search::placeholder { color: var(--hilfstext); }
  .msel-opts { display: flex; flex-direction: column; gap: 2px; }
  .msel-none { font-size: 12px; color: var(--muted); padding: 6px 8px; }
  .blk-hint { font-size: 9px; letter-spacing: .08em; color: var(--overdue); text-transform: none; }
  .blk-hint.done { color: var(--muted-hell); }

  /* Subtasks */
  .sub-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sub-item { display: flex; align-items: center; gap: 7px; border-radius: 7px; transition: background .12s, opacity .12s; }
  .sub-item.dragging { opacity: .4; }
  .sub-item.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
  .sub-item.drop-below { box-shadow: inset 0 -2px 0 var(--accent); }
  .sub-drag { flex: 0 0 auto; cursor: grab; color: var(--muted-hell); font-size: 13px; line-height: 1; padding: 0 1px;
              user-select: none; transition: color .15s; }
  .sub-drag:hover { color: var(--muted); }
  .sub-drag:active { cursor: grabbing; }
  .cb { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 15px; height: 15px;
        border: 1.5px solid var(--muted); border-radius: 4px; cursor: pointer; line-height: 1; user-select: none;
        transition: background .12s, border-color .12s; }
  .cb.done { background: var(--accent); border-color: var(--accent); }
  .cb.done::after { content: "✓"; color: var(--on-accent); font-size: 11px; }
  .sub-item .sub-txt { flex: 1 1 auto; font-size: 13.5px; cursor: text; overflow-wrap: anywhere; }
  .sub-item.done .sub-txt { color: var(--muted); text-decoration: line-through; }
  /* Inline-Bearbeitung eines Subtasks */
  .sub-item .sub-edit { flex: 1 1 auto; font-family: inherit; font-size: 13.5px; color: var(--ink); background: none;
                        border: 1px solid var(--accent); border-radius: 6px; padding: 4px 7px; }
  .sub-item .sub-edit:focus { outline: none; }
  .sub-item .sub-del { border: none; background: none; color: var(--muted-hell); font-size: 15px; padding: 0 4px; }
  .sub-item .sub-del:hover { color: var(--overdue); }
  .sub-own { position: relative; flex: 0 0 auto; }
  .sub-own-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rahmen); background: none;
                 color: var(--muted); border-radius: 20px; padding: 2px 9px; font-size: 9px; letter-spacing: .1em;
                 text-transform: uppercase; transition: border-color .2s, color .2s; white-space: nowrap; }
  .sub-own-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sub-own-btn.empty { color: var(--muted-hell); }
  .sub-own-panel { position: absolute; top: calc(100% + 5px); right: 0; z-index: 45; display: none; flex-direction: column;
                   gap: 2px; min-width: 150px; padding: 7px; background: var(--cream); border: 1px solid var(--line);
                   border-radius: var(--feld-radius); box-shadow: var(--shadow-lg); }
  .sub-own-panel.open { display: flex; }
  .sub-own-panel .dd-opt { font-size: 12.5px; padding: 6px 8px; }
  .inline-add { display: flex; gap: 8px; }
  .inline-add input { flex: 1 1 auto; padding: 7px 10px; border: 1px solid var(--rahmen); border-radius: var(--feld-radius);
                      font-family: inherit; font-size: 13px; background: none; color: var(--ink); }
  .inline-add input:focus { outline: none; border-color: var(--accent); }
  .inline-add button { border: 1px solid var(--rahmen); background: none; color: var(--muted); padding: 0 12px;
                       border-radius: var(--feld-radius); }
  .inline-add button:hover { border-color: var(--accent); color: var(--accent); }

  /* Updates */
  .upd-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .upd { border-left: 1px solid var(--line); padding-left: 12px; position: relative; }
  .upd-meta { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-hell); margin-bottom: 3px;
              display: flex; align-items: center; gap: 8px; }
  .upd-meta .upd-edited { font-style: italic; letter-spacing: .04em; }
  .upd-actions { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .upd:hover .upd-actions { opacity: 1; }
  .upd-actions button { border: none; background: none; color: var(--muted-hell); font-size: 11px; letter-spacing: .06em;
                        text-transform: uppercase; padding: 1px 5px; border-radius: 5px; }
  .upd-actions button:hover { color: var(--ink); background: var(--chip); }
  .upd-actions button.del:hover { color: var(--overdue); }
  .upd-text { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
  /* Update im Bearbeitungsmodus */
  .upd-edit-wrap { margin-top: 4px; }
  .upd-edit-actions { display: flex; gap: 6px; margin-top: 6px; }
  .upd-edit-actions button { border: 1px solid var(--rahmen); background: none; color: var(--muted); padding: 4px 11px;
                             border-radius: var(--feld-radius); }
  .upd-edit-actions button.save { color: var(--accent); border-color: var(--accent); }
  .upd-edit-actions button:hover { border-color: var(--muted); color: var(--ink); }
  .upd-edit-actions button.save:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .upd-add textarea { width: 100%; padding: 8px 11px; border: 1px solid var(--rahmen); border-radius: var(--feld-radius);
                      font-family: inherit; font-size: 13.5px; background: none; color: var(--ink); resize: vertical;
                      min-height: 54px; }
  .upd-add textarea:focus { outline: none; border-color: var(--accent); }
  /* Fußzeile der Update-Eingabe: Autor-Auswahl + Absenden */
  .upd-add-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .upd-author { display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: var(--feld-radius);
                transition: background .2s var(--weich); }
  .upd-author-lbl { font-size: 11px; color: var(--muted-hell); letter-spacing: .04em; }
  .upd-author-sel { font-family: inherit; font-size: 13px; color: var(--ink); background: none;
                    border: 1px solid var(--rahmen); border-radius: var(--feld-radius); padding: 5px 9px; cursor: pointer;
                    transition: border-color .2s var(--weich); }
  .upd-author-sel:focus { outline: none; border-color: var(--accent); }
  .upd-author.missing { background: color-mix(in srgb, var(--overdue) 12%, transparent); }
  .upd-author.missing .upd-author-sel { border-color: var(--overdue); }
  .upd-author.missing .upd-author-lbl { color: var(--overdue); }
  .upd-send { margin-left: auto; border: 1px solid var(--accent); background: none; color: var(--accent);
              padding: 6px 16px; border-radius: var(--feld-radius); font-family: inherit; font-size: 13px; cursor: pointer;
              transition: background .2s var(--weich); }
  .upd-send:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }

  .sub-head { display: flex; align-items: baseline; justify-content: space-between; }
  .sub-head h4 { margin: 0 0 12px; font-size: 9px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
                 color: var(--muted-hell); }
  .sub-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .modal-actions { flex: 0 0 auto; display: flex; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); align-items: center; }
  .val-msg { font-size: 12px; color: var(--overdue); margin-right: auto; opacity: 0; transition: opacity .2s; }
  .val-msg.show { opacity: 1; }
  .field.invalid .pick-row, .field.invalid select { outline: 1px solid var(--overdue); outline-offset: 3px; border-radius: var(--feld-radius); }
  .modal-actions .spacer { flex: 1; }
  .danger { color: var(--overdue); border: none; background: none; padding: 7px 10px; }
  .danger:hover { text-decoration: underline; text-underline-offset: 3px; }

  ::-webkit-scrollbar { height: 9px; width: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 20px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-hell); }
  .hidden { display: none !important; }
  /* Hinweis-Toast (z.B. Link kopiert) */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
           background: var(--ink); color: var(--cream); font-size: 13px; padding: 10px 18px; border-radius: 10px;
           box-shadow: var(--shadow-lg); z-index: 200; opacity: 0; pointer-events: none;
           transition: opacity .2s var(--weich), transform .2s var(--weich); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Fluss-Hinweis in der Filterzeile */
  .flow-hint { margin-left: auto; font-size: 10.5px; letter-spacing: .04em; color: var(--muted-hell); white-space: nowrap; }
  .flow-hint b { color: var(--accent); font-weight: 700; padding: 0 2px; }
  #ddViewPanel .dd-opt .box { border-radius: 50%; }
  @media (max-width: 900px){ .flow-hint { display: none; } }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="brand">Land &amp; <b>Expand</b></div>
    <div class="head-spacer"></div>
    <span class="last-upd" id="lastUpd"></span>
    <span class="data-warn" id="dataWarn" title="">⚠ Datenproblem</span>
    <div class="sync-wrap" id="syncWrap">
      <span class="sync ok fade" id="syncBadge"></span>
      <div class="save-panel" id="savePanel" hidden></div>
    </div>
    <button class="btn" id="btnRefresh" title="Neu aus dem Sheet laden">↻</button>
    <div class="dd" id="ddView">
      <button class="dd-trigger" id="ddViewBtn">Ansicht: Gantt <span class="caret">▼</span></button>
      <div class="dd-panel" id="ddViewPanel">
        <div class="dd-opt" data-view="gantt"><span class="box"></span>Gantt</div>
        <div class="dd-opt" data-view="tasks"><span class="box"></span>Aufgaben</div>
      </div>
    </div>
    <button class="btn" id="btnTheme">Dunkel</button>
    <button class="btn primary" id="btnNew">+ Neues Ticket</button>
  </div>
</header>



<div class="filter-row" id="filterRow">
  <input class="search" id="search" type="search" placeholder="Suchen …">
  <div class="dd" id="ddOwner">
    <button class="dd-trigger" id="ddOwnerBtn">Owner <span class="caret">▼</span></button>
    <div class="dd-panel" id="ddOwnerPanel"></div>
  </div>
  <div class="dd" id="ddStatus">
    <button class="dd-trigger" id="ddStatusBtn">Status <span class="caret">▼</span></button>
    <div class="dd-panel" id="ddStatusPanel"></div>
  </div>
  <div class="dd" id="ddPrio">
    <button class="dd-trigger" id="ddPrioBtn">Priorität <span class="caret">▼</span></button>
    <div class="dd-panel" id="ddPrioPanel"></div>
  </div>
  <div class="dd" id="ddTag">
    <button class="dd-trigger" id="ddTagBtn">Tag <span class="caret">▼</span></button>
    <div class="dd-panel" id="ddTagPanel"></div>
  </div>
  <!-- Gantt-spezifische Controls (in der Aufgaben-Ansicht ausgeblendet) -->
  <div class="gantt-controls" id="ganttControls">
    <div class="gantt-unit">
      <button class="seg" id="unitDay" data-unit="day">Tage</button>
      <button class="seg" id="unitWeek" data-unit="week">Wochen</button>
    </div>
    <div class="gantt-group">
      <button class="seg" id="grpNone" data-group="none">Keine</button>
      <button class="seg" id="grpOwner" data-group="owner">Owner</button>
      <button class="seg" id="grpTag" data-group="tag">Tag</button>
    </div>
    <button class="btn" id="btnLinks" title="Abhängigkeits-Verbindungen ein-/ausblenden">⇄ Verbindungen</button>
  </div>
</div>

<div class="gantt-view" id="ganttView">
  <div class="gantt-progress" id="ganttProgress"></div>
  <div class="gantt-nodate" id="ganttNoDate"></div>
  <div class="gantt-scroll" id="ganttScroll">
    <div class="gantt-inner" id="ganttInner"></div>
  </div>
</div>

<div class="tasks-view" id="tasksView" hidden></div>


<!-- Ticket-Dialog -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tk-kopf">
      <input class="tk-titel" id="fTitle" placeholder="Titel des Tickets" autocomplete="off">
      <div class="stage-path" id="stagePath"></div>
    </div>

    <div class="meta-grid meta-top">
      <div class="mfield">
        <label>Start</label>
        <input type="date" class="mdate" id="fStart">
      </div>
      <div class="mfield">
        <label>Ende</label>
        <input type="date" class="mdate" id="fEnd">
      </div>
      <div class="mfield">
        <label>Priorität</label>
        <div class="msel" id="mselPrio">
          <button type="button" class="msel-trigger"><span class="msel-vals"></span><span class="msel-caret">▼</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
      <div class="mfield" id="fldOwners">
        <label>Owner</label>
        <div class="msel" id="mselOwners">
          <button type="button" class="msel-trigger"><span class="msel-vals"></span><span class="msel-caret">▼</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
      <div class="mfield">
        <label>Stakeholder</label>
        <div class="msel" id="mselStakeholder">
          <button type="button" class="msel-trigger"><span class="msel-vals"></span><span class="msel-caret">▼</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
      <div class="mfield">
        <label>Tag</label>
        <div class="msel" id="mselTag">
          <button type="button" class="msel-trigger"><span class="msel-vals"></span><span class="msel-caret">▼</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
      <div class="mfield" id="fldBlockedBy" style="grid-column: 1 / -1;">
        <label>Blocked by <span class="blk-hint" id="blkHint"></span></label>
        <div class="msel" id="mselBlockedBy">
          <button type="button" class="msel-trigger"><span class="msel-vals"></span><span class="msel-caret">▼</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
    </div>

    <div class="modal-body">
      <div class="goal-reopen" id="goalReopen" title="Ziel einblenden">📌 Ziel / Aufgabe ›</div>
      <div class="mcol" id="mcolGoal">
        <div class="field goal-field">
          <div class="collapse-label" id="goalHead">
            <span class="goal-pin">📌</span>
            <label>Ziel / Aufgabe</label>
            <button type="button" class="goal-collapse" id="goalToggle" title="Ziel-Spalte einklappen">›</button>
          </div>
          <div class="rte-wrap" data-rte="goal">
            <div class="rte-bar"></div>
            <div class="rte" id="fGoal" contenteditable="true" data-placeholder=""></div>
          </div>
        </div>
      </div>

      <div class="mcol" id="mcolDesc">
        <div class="field">
          <label>Beschreibung</label>
          <div class="rte-wrap" data-rte="desc">
            <div class="rte-bar"></div>
            <div class="rte" id="fDesc" contenteditable="true" data-placeholder=""></div>
          </div>
        </div>
      </div>

      <div class="mcol" id="mcolRight">
        <div class="field" style="margin-bottom:24px;">
          <div class="sub-head">
            <h4>Subtasks</h4>
            <span class="sub-count" id="subCount"></span>
          </div>
          <div class="sub-list" id="subList"></div>
          <div class="inline-add">
            <input id="subInput" placeholder="Subtask hinzufügen …" autocomplete="off">
            <button id="subAdd">+</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Updates</label>
          <div class="upd-list" id="updList"></div>
          <div class="upd-add">
            <div class="rte-wrap" data-rte="upd">
              <div class="rte-bar"></div>
              <div class="rte sm" id="updInput" contenteditable="true" data-placeholder=""></div>
            </div>
            <div class="upd-add-foot">
              <div class="upd-author" id="updAuthorWrap">
                <span class="upd-author-lbl">Von:</span>
                <select id="updAuthor" class="upd-author-sel"></select>
              </div>
              <button type="button" id="updSend" class="upd-send">Absenden</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="danger" id="btnDelete">Löschen</button>
      <button class="btn" id="btnCopyLink" title="Link zu diesem Ticket kopieren">🔗 Link kopieren</button>
      <span class="val-msg" id="valMsg"></span>
      <button class="btn" id="btnCancel">Schließen</button>
      <button class="btn primary" id="btnSave">Speichern</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   MOCK-BACKEND — Platzhalter statt GSheet/Apps-Script.
   Alle Lese-/Schreibzugriffe laufen über das Objekt `Backend`.
   Später wird hier fetch() gegen die Web-App-URL gesetzt; die UI bleibt gleich.
   ===================================================================== */
/* =====================================================================
   BACKEND — Google Sheet über Apps Script Web-App.
   Protokoll identisch zum bewährten "Mein Board":
     Lesen : GET ?tabs=Phases,Owners,Tickets,Subtasks,Updates -> { Tab:[rows] }
     Schreiben (POST text/plain, kein Preflight):
       {action:"append", tab, row}
       {action:"update", tab, idField, idValue, row}
       {action:"delete", tab, idField, idValue}
       {action:"batch",  ops:[…]}

   Sheet-Struktur (Header exakt):
     Phases   : id | name | start | end
     Owners   : name
     Tickets  : id | title | description | phaseId | status | owners
     Subtasks : subtask_id | ticket_id | title | done | pos | owners
     Updates  : update_id | ticket_id | author | ts | text
   ===================================================================== */
const WEBAPP_URL   = "https://script.google.com/macros/s/AKfycbzOt_fkBu57jCebn3wy5wndRHYAH_1z5eQBAqtxUuTaWlG8tSBRkBBfJ8E_fBOE6WoGmA/exec";   // <-- Web-App-URL aus Apps Script hier eintragen
const WEBAPP_TOKEN = "";   // optional, muss zu TOKEN im Script passen

const TAB_PHASES = "Phases", TAB_OWNERS = "Owners", TAB_TICKETS = "Tickets",
      TAB_SUBTASKS = "Subtasks", TAB_UPDATES = "Updates", TAB_TAGS = "Tags";

function backendConfigured(){ return !!WEBAPP_URL; }
function uid(p){ return (p||"") + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---- Roh-Kommunikation (nach Source-Vorbild) ---- */
async function apiCall(params, opt){
  opt = opt || {};
  if(!backendConfigured()) throw new Error("WEBAPP_URL ist nicht gesetzt.");
  const p = Object.assign({}, params);
  if(WEBAPP_TOKEN) p.token = WEBAPP_TOKEN;
  const isWrite = p.action === "append" || p.action === "update" || p.action === "delete" || p.action === "batch";

  const usp = new URLSearchParams();
  Object.keys(p).forEach(k => { const v = p[k]; if(v==null) return; usp.set(k, (typeof v === "object") ? JSON.stringify(v) : String(v)); });
  const url = WEBAPP_URL + (WEBAPP_URL.includes("?") ? "&" : "?") + usp.toString();
  // Schreiben IMMER per POST (text/plain -> kein CORS-Preflight, keine Längengrenze).
  // Nur Lesen läuft per GET. GET an doGet kann nicht schreiben -> sonst Sync-Fehler.
  const usePost = isWrite;

  // Für den POST eine SCHLANKE URL bauen: nur die kleinen Kennungen (action/token),
  // NICHT die großen Objekte (ops/row). So bleibt die URL kurz, aber das Backend
  // erkennt selbst dann noch die Schreib-Aktion, wenn Google den POST-Body bei einer
  // Weiterleitung verwirft. Die eigentlichen Daten stehen im Body (JSON).
  const uspPost = new URLSearchParams();
  if(p.action) uspPost.set("action", p.action);
  if(p.token)  uspPost.set("token", p.token);
  const postUrl = WEBAPP_URL + (WEBAPP_URL.includes("?") ? "&" : "?") + uspPost.toString();

  // Wiederholbarkeit bei transienten Fehlern (kurzer 500, Timeout, Body-Verlust
  // bei Weiterleitung). Lesen sowie update/delete sind ohnehin idempotent.
  // batch wird ebenfalls wiederholt: das Apps-Script (v3) macht append idempotent
  // (append prüft die ID und wird bei Bedarf zum update), daher entstehen keine
  // Duplikate, wenn ein Bündel ein zweites Mal ankommt.
  const wiederholbar = !p.action || p.action === "update" || p.action === "delete" || p.action === "batch";
  const maxVersuche = opt.einmal ? 1 : (wiederholbar ? 3 : 1);
  let lastErr = null;
  for(let versuch = 0; versuch < maxVersuche; versuch++){
    if(versuch) await new Promise(r => setTimeout(r, versuch * 700));
    try {
      const zeitlimit = p.action ? 90000 : 45000;
      const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const frist = ctl ? setTimeout(() => ctl.abort(), zeitlimit) : null;
      let res;
      try {
        // Beim POST eine schlanke URL mit action/token verwenden (siehe oben): Falls Google
        // den POST bei einer Weiterleitung in einen parameterlosen GET umwandelt, erkennt
        // das Backend über ?action=… trotzdem, dass es sich um einen Schreib-Aufruf handelt,
        // und liefert eine klare Meldung statt "Kein tab/tabs Parameter".
        res = usePost
          ? await fetch(postUrl, { method:"POST", redirect:"follow", signal: ctl && ctl.signal, headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(p) })
          : await fetch(url, { method:"GET", redirect:"follow", signal: ctl && ctl.signal });
      } finally { if(frist) clearTimeout(frist); }
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch(_){ throw new Error("Unerwartete Antwort (HTTP " + res.status + "). Web-App-Freigabe prüfen."); }
      if(data && data.error){
        // Fehler mit Marker "[RETRY]" sind transient (z.B. Body-Verlust bei einer
        // Weiterleitung) -> erneut versuchen. Alle anderen Backend-Fehler sind endgültig.
        const roh = String(data.error);
        const transient = roh.indexOf("[RETRY]") === 0;
        const err = new Error(roh.replace(/^\[RETRY\]\s*/, ""));
        if(!transient) err.endgueltig = true;
        throw err;
      }
      return data;
    } catch(e){
      if(e && (e.name === "AbortError" || /aborted/i.test(e.message||""))) e = new Error("Zeitüberschreitung — Google hat nicht geantwortet.");
      lastErr = e; if(e && e.endgueltig) break;
    }
  }
  throw lastErr;
}
const sheetReadTab    = tab => apiCall({ tab });
// Erst Sammel-Aufruf versuchen; scheitert er (fehlender Tab lässt manche Skripte
// crashen), einzeln nachladen. Robuster als ein einziger ?tabs=-Aufruf.
async function sheetReadTabs(names){
  try {
    const d = await apiCall({ tabs: names.join(",") });
    const passt = d && typeof d === "object" && !Array.isArray(d) && names.every(n => Object.prototype.hasOwnProperty.call(d, n));
    if(passt) return d;
  } catch(_){ /* Fallback unten */ }
  const out = {};
  for(const n of names){
    try { out[n] = await sheetReadTab(n); }
    catch(e){ out[n] = { error: (e && e.message) || String(e) }; }
  }
  return out;
}
const sheetAppendRow  = (tab, row) => apiCall({ action:"append", tab, row });
const sheetUpdateRow  = (tab, idField, idValue, row) => apiCall({ action:"update", tab, idField, idValue, row });
const sheetDeleteRows = (tab, idField, idValue) => apiCall({ action:"delete", tab, idField, idValue });
async function sheetBatch(ops){
  const d = await apiCall({ action:"batch", ops });
  if(!d || !Array.isArray(d.results)) throw new Error("Unerwartete Antwort auf das Bündel.");
  return d.results;
}
const opAppend = (tab, row)                   => ({ action:"append", tab, row });

/* ---- Zeilen-Mapping (Frontend-Modell <-> Sheet-Zeile) ---- */
const bool = b => b ? "TRUE" : "FALSE";
const parseBool = v => String(v).toUpperCase() === "TRUE";
const joinOwners  = a => (a||[]).join(", ");
const splitOwners = s => String(s||"").split(",").map(x=>x.trim()).filter(Boolean);

function ticketToRow(t){
  return { id:t.id, title:t.title||"", goal:t.goal||"", description:t.desc||"", start:t.start||"", end:t.end||"", prio:t.prio||"", status:t.status||DEFAULT_STATUS, owners:joinOwners(t.owners), tags:joinOwners(t.tags), stakeholder:t.stakeholder||"", blocked_by:Array.isArray(t.blockedBy)?t.blockedBy.join(", "):(t.blockedBy||""), created:t.created||"", updated:t.updated||"" };

/* ---- Schreib-Warteschlange (optimistisch, ein Auftrag nach dem anderen) ---- */
const queue = [];
let queueRunning = false, queueSeq = 0;

// Verlauf erfolgreich gespeicherter Aufträge (neueste zuerst), für das Speichern-Panel.
const saveHistory = [];
const SAVE_HISTORY_MAX = 40;
function pushHistory(job){
  saveHistory.unshift({
    label: job.label || "Gespeichert",
    ops: (job.ops || []).length,
    ts: Date.now()
  });
  if(saveHistory.length > SAVE_HISTORY_MAX) saveHistory.length = SAVE_HISTORY_MAX;
}

function enqueue(label, ops){
  queue.push({ id:++queueSeq, label, ops, state:"wartet" });
  saveCache();   // lokalen Stand sofort sichern (State ist bereits aktualisiert)
  renderSync();
  clearTimeout(enqueue._t);
  enqueue._t = setTimeout(runQueue, 60);
}
function batchGruppe(){
  const gruppe = []; let zeichen = 0;
  for(const j of queue){
    if(j.state === "fehler" || !j.ops || !j.ops.length) break;
    const laenge = JSON.stringify(j.ops).length;
    if(gruppe.length && (zeichen + laenge > 60000 || gruppe.length >= 25)) break;
    zeichen += laenge; gruppe.push(j);
  }
  return gruppe;
}
async function runQueue(){
  if(queueRunning) return;
  queueRunning = true;
  try {
    while(queue.length){
      const job = queue[0];
      if(job.state === "fehler") break;

      const gruppe = batchGruppe();
      const vorgaenge = gruppe.reduce((n,j)=> n + j.ops.length, 0);
      if(vorgaenge >= 1){
        gruppe.forEach(j=> j.state = "laeuft"); renderSync();
        // Vorgänge desselben Auftrags markieren, damit ein Fehler die Folgeschritte überspringt
        const alleOps = gruppe.flatMap(j => j.ops.length > 1 ? j.ops.map(o => Object.assign({ grp:"j"+j.id }, o)) : j.ops);
        let results;
        try { results = await sheetBatch(alleOps); }
        catch(e){
          gruppe[0].state = "fehler"; gruppe[0].err = (e && e.message) || String(e);
          renderSync(); break;
        }
        // Ergebnisse zuordnen; Erledigtes verlässt die Queue sofort
        let i = 0, gesamt = gruppe.reduce((n,j)=> n + j.ops.length, 0);
        if(results.length !== gesamt){
          gruppe[0].state = "fehler"; gruppe[0].err = "Bündel kam unvollständig zurück. Bitte aktualisieren.";
          renderSync(); break;
        }
        for(const j of gruppe){
          const meine = results.slice(i, i + j.ops.length); i += j.ops.length;
          const schlecht = meine.find(r => r && (r.error || r.skipped));
          if(!schlecht){ j.done = true; pushHistory(j); }
          else { j.state = "fehler"; j.err = schlecht.error || "Zusammengehöriger Schritt fehlgeschlagen."; break; }
        }
        for(let k = queue.length - 1; k >= 0; k--) if(queue[k].done) queue.splice(k, 1);
        renderSync();
        continue;
      }
    }
  } finally { queueRunning = false; renderSync(); }
}

/* ---- Speicher-Panel (Verlauf) ---- */
function relZeit(ms){
  const d = Date.now() - ms, s = Math.floor(d/1000), m = Math.floor(s/60), h = Math.floor(m/60), t = Math.floor(h/24);
  if(s < 5) return "gerade eben";
  if(s < 60) return `vor ${s} Sek`;
  if(m < 60) return `vor ${m} Min`;
  if(h < 24) return `vor ${h} Std`;
  return `vor ${t} Tag${t>1?"en":""}`;
}
function renderSavePanel(){
  const el = $("#savePanel"); if(!el) return;
  const offen = queue.filter(j=> j.state !== "fehler" && !j.done);
  const fehler = queue.find(j=> j.state === "fehler");
  let html = `<div class="sp-head">Speicher-Verlauf</div>`;

  if(fehler){
    html += `<div class="sp-error"><b>Nicht gespeichert:</b><br>${esc(fehler.err || "Unbekannter Fehler")}
      <div class="sp-error-job">${esc(fehler.label || "")}</div></div>`;
  }
  if(offen.length){
    html += `<div class="sp-pending">↻ ${offen.length} wird gespeichert …</div>`;
  }

  if(!saveHistory.length && !offen.length && !fehler){
    html += `<div class="sp-empty">Noch nichts gespeichert in dieser Sitzung.</div>`;
  } else if(saveHistory.length){
    html += `<div class="sp-list">` + saveHistory.map(h => `
      <div class="sp-item">
        <span class="sp-check">✓</span>
        <div class="sp-main">
          <div class="sp-label">${esc(h.label)}</div>
          <div class="sp-meta">${relZeit(h.ts)}${h.ops>1?` · ${h.ops} Änderungen`:""}</div>
        </div>
      </div>`).join("") + `</div>`;
  }
  el.innerHTML = html;
}
function toggleSavePanel(){
  const el = $("#savePanel"); if(!el) return;
  if(el.hidden){ renderSavePanel(); el.hidden = false; }
  else el.hidden = true;
}
function closeSavePanel(){ const el = $("#savePanel"); if(el) el.hidden = true; }

/* ---- Sync-Anzeige ---- */
function renderSync(){
  const el = $("#syncBadge"); if(!el) return;
  const offen = queue.filter(j=> j.state !== "fehler").length;
  const fehler = queue.find(j=> j.state === "fehler");
  if(fehler){ el.className = "sync err"; el.textContent = "⚠ Sync-Fehler"; el.title = "klicken für Details"; el._err = fehler.err || "Unbekannter Fehler"; }
  else if(offen){ el.className = "sync busy"; el.textContent = "↻ Speichert …"; el.title = "klicken für Verlauf"; el._err = null; }
  else { el.className = "sync ok"; el.textContent = "✓ Gespeichert"; el.title = "klicken für Verlauf"; el._err = null; setTimeout(()=>{ if(!queue.length && $("#savePanel")?.hidden) el.className = "sync ok fade"; }, 1500); }
  // Panel live nachziehen, wenn offen
  if($("#savePanel") && !$("#savePanel").hidden) renderSavePanel();
}
